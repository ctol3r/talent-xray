<title>TalentOS Lite</title>
<style>
  /* ── Tokens: dark-first workroom; light is the swapped set ─────────── */
  :root {
    --ink: #10151b;
    --surface: #171e26;
    --surface-2: #1d2630;
    --line: #2a3440;
    --line-soft: #222b35;
    --text: #e7ecf1;
    --muted: #8c99a6;
    --faint: #5f6b77;
    --accent: #efa53e;
    --accent-ink: #10151b;
    --accent-soft: rgba(239, 165, 62, 0.12);
    --ok: #5cbe8f;
    --warn: #d9b54a;
    --bad: #d97762;
    --unknown: #7e8b98;
    --chip-ink: #10151b;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sans: "Archivo", system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #f5f3ee;
      --surface: #fdfcf9;
      --surface-2: #efece4;
      --line: #d8d2c6;
      --line-soft: #e5e0d6;
      --text: #23292f;
      --muted: #68727c;
      --faint: #98a0a9;
      --accent: #c07d17;
      --accent-ink: #fdfcf9;
      --accent-soft: rgba(192, 125, 23, 0.1);
      --ok: #2e8f63;
      --warn: #9c7c1c;
      --bad: #b6503a;
      --unknown: #6d7883;
      --chip-ink: #fdfcf9;
    }
  }
  :root[data-theme="light"] {
    --ink: #f5f3ee;
    --surface: #fdfcf9;
    --surface-2: #efece4;
    --line: #d8d2c6;
    --line-soft: #e5e0d6;
    --text: #23292f;
    --muted: #68727c;
    --faint: #98a0a9;
    --accent: #c07d17;
    --accent-ink: #fdfcf9;
    --accent-soft: rgba(192, 125, 23, 0.1);
    --ok: #2e8f63;
    --warn: #9c7c1c;
    --bad: #b6503a;
    --unknown: #6d7883;
    --chip-ink: #fdfcf9;
  }

  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; height: 100%;
    background: var(--ink); color: var(--text);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Rail ──────────────────────────────────────────────────────────── */
  .rail {
    width: 252px; flex: none; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--surface);
    overflow-y: auto;
  }
  .brand { padding: 16px 16px 10px; border-bottom: 1px solid var(--line-soft); }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }
  .brand h1 span { color: var(--accent); }
  .brand small { color: var(--muted); font-size: 11px; display: block; margin-top: 2px; }
  .rail-section { padding: 12px 10px 4px; }
  .rail-label {
    font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--faint); padding: 0 6px 6px;
  }
  .search-item {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    color: var(--text); font: inherit; padding: 7px 8px; border-radius: 6px; cursor: pointer;
  }
  .search-item:hover { background: var(--surface-2); }
  .search-item.active { background: var(--accent-soft); }
  .search-item .si-name { font-weight: 600; font-size: 13px; }
  .search-item .si-sub { color: var(--muted); font-size: 11.5px; }
  .modnav { padding: 4px 10px 16px; }
  .mod-item {
    display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none;
    color: var(--muted); font: inherit; font-size: 12.5px; padding: 5px 8px;
    border-radius: 6px; cursor: pointer; text-align: left;
  }
  .mod-item:hover { background: var(--surface-2); color: var(--text); }
  .mod-item.active { color: var(--text); background: var(--surface-2); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--line); }
  .dot.done { background: var(--ok); }
  .rail-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line-soft); color: var(--faint); font-size: 11px; }

  /* ── Main ──────────────────────────────────────────────────────────── */
  .main { flex: 1; overflow-y: auto; }
  .main-inner { max-width: 880px; margin: 0 auto; padding: 20px 28px 80px; }
  .mod-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 6px 0 4px; }
  .mod-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .mod-desc { color: var(--muted); font-size: 13px; margin: 0 0 16px; max-width: 62ch; }
  .spacer { flex: 1; }

  button.btn {
    font: 600 12.5px/1 var(--sans); padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  }
  button.btn:hover { border-color: var(--muted); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.btn.primary:hover { filter: brightness(1.08); }
  button.btn:disabled { opacity: 0.5; cursor: default; }
  button.btn.small { padding: 5px 9px; font-size: 11.5px; }
  button:focus-visible, .search-item:focus-visible, .mod-item:focus-visible,
  input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 16px 18px; margin: 0 0 14px; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
  .panel h4 { margin: 14px 0 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .panel p { margin: 6px 0; }
  .panel ul { margin: 6px 0; padding-left: 20px; }
  .panel li { margin: 4px 0; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); margin: 0; }
  .kv dd { margin: 0; }

  .chip {
    display: inline-block; font: 600 10px/1 var(--mono); letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 7px; border-radius: 4px; vertical-align: 1px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .chip.inference { border-color: var(--accent); color: var(--accent); }
  .chip.ok { border-color: var(--ok); color: var(--ok); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }
  .chip.unknown { border-color: var(--unknown); color: var(--unknown); }
  .chip.example { border-color: var(--warn); color: var(--warn); }

  .notice { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 14px; margin: 0 0 14px; font-size: 13px; color: var(--muted); background: var(--surface); }
  .notice.error { border-left-color: var(--bad); }
  .notice.warning { border-left-color: var(--warn); }
  .notice strong { color: var(--text); }

  textarea, input[type="text"], select {
    width: 100%; background: var(--ink); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: 13px/1.5 var(--sans);
  }
  textarea.mono, pre.mono { font: 12px/1.6 var(--mono); }
  textarea { resize: vertical; }
  label.field { display: block; margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  label.field b { display: block; margin-bottom: 3px; color: var(--text); font-weight: 600; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
  @media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } #app { display: block; height: auto; } .rail { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); } }

  pre.mono {
    background: var(--ink); border: 1px solid var(--line-soft); border-radius: 6px;
    padding: 10px 12px; overflow-x: auto; margin: 6px 0; white-space: pre-wrap; word-break: break-word;
  }
  .qrow { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--line-soft); padding: 10px 0; }
  .qrow:first-child { border-top: 0; }
  .qrow .qmeta { width: 190px; flex: none; font-size: 11.5px; color: var(--muted); }
  .qrow .qmeta .plat { color: var(--text); font-weight: 600; font-size: 12px; }
  .qrow pre.mono { flex: 1; margin: 0; }
  .qrow .btn { flex: none; }
  .num { font-variant-numeric: tabular-nums; }

  .thinking { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .thinking::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--accent); border-top-color: transparent;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; } }

  .stream { font: 12px/1.6 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto; margin-top: 8px; }
  .why { color: var(--muted); font-size: 12.5px; }
  .qq { font-weight: 600; }
  a { color: var(--accent); }
  .cand-list .qrow .qmeta { width: 230px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<div id="app">
  <nav class="rail">
    <div class="brand">
      <h1>Talent<span>OS</span> Lite</h1>
      <small>AI recruiting workroom · runs on your Claude</small>
    </div>
    <div class="rail-section">
      <div class="rail-label">Searches</div>
      <div id="search-list"></div>
      <button class="btn small" id="new-search-btn" style="margin:8px 6px 0">+ New search</button>
    </div>
    <div class="rail-section">
      <div class="rail-label">Modules</div>
      <div class="modnav" id="mod-nav"></div>
    </div>
    <div class="rail-foot" id="rail-foot">Nothing sends automatically. Every AI draft is editable.</div>
  </nav>
  <main class="main"><div class="main-inner" id="main"></div></main>
</div>

<script>
"use strict";
/* TalentOS Lite — artifact companion to the local TalentOS app.
   AI via the `sample` capability (viewer's own Claude — no API key);
   persistence via `db` with a localStorage fallback. Prompts and the
   deterministic query composer are ported from the repo (talentos/src). */

/* ── Utilities ─────────────────────────────────────────────────────────── */
const $ = (sel, el) => (el || document).querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const clip = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n) + "\n…[truncated]" : s; };

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); if (btn) { const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = old; }, 1200); } }
  catch { if (btn) btn.textContent = "Copy failed"; }
}

/* ── Fair hiring + data honesty (ported from lib/domain/fair-hiring) ──── */
const PROTECTED_TRAITS = ["race","ethnicity","religion","age","gender identity","disability","national origin","sexual orientation","health condition","pregnancy","family status","marital status","political affiliation","veteran status"];
const NON_INFERENCE = `Fair-hiring constraints (mandatory):
- Never infer, mention, request, or reason about protected characteristics: ${PROTECTED_TRAITS.join(", ")}.
- Evaluate and describe candidates only through job-related professional evidence that is observable in the provided material.
- Never recommend rejecting, deprioritizing, or preferring anyone on the basis of a protected characteristic.
- If provided material contains protected-characteristic information, ignore it entirely; do not repeat it in output.
- All output is advisory decision support for a human recruiter; never phrase output as an employment decision.`;

function systemPrelude(persona) {
  return `You are ${persona} working inside a recruiting workroom used by one professional recruiter. Your output is decision support the recruiter will review and edit — write with the judgment of an elite practitioner, not the caution of a form letter.

${NON_INFERENCE}

Data honesty (mandatory):
- Never fabricate facts, statistics, URLs, or claims about specific real people.
- You have no live web access. Never label anything "verified" — that label is reserved for claims a human confirmed against a source. Use "estimated" for order-of-magnitude professional judgment, "inferred" for reasoned guesses, "unknown" when you cannot know. "Reliable exact data unavailable" is a valid, welcome answer.
- Surface your assumptions and open questions explicitly instead of projecting false confidence.
- Adapt everything to THIS role, company, seniority, geography, and industry. Generic recruiting boilerplate is a failure.
Everything you produce is a draft the recruiter can edit; write content that is specific enough to be worth editing.`;
}

function scanForProtectedTraits(value) {
  const text = JSON.stringify(value).toLowerCase();
  return PROTECTED_TRAITS.filter((t) => text.includes(t));
}

/* Model output may never claim "verified" (NO FAKE DATA). */
function downgradeVerified(node) {
  if (Array.isArray(node)) { node.forEach(downgradeVerified); return; }
  if (node && typeof node === "object") {
    if (node.certainty === "verified") { node.certainty = "inferred"; node.note = ((node.note || "") + " [downgraded from 'verified' — model output cannot verify]").trim(); }
    Object.values(node).forEach(downgradeVerified);
  }
}

/* ── Deterministic composer (ported from lib/domain/search-strings) ───── */
function quoteTerm(term) {
  const t = String(term).trim();
  if (!t) return "";
  if (/^[-"(]/.test(t) || /^\w+:/.test(t)) return t;
  return /\s/.test(t) ? `"${t.replace(/"/g, "")}"` : t;
}
function orGroup(terms) {
  const cleaned = (terms || []).filter(Boolean).map(quoteTerm).filter(Boolean);
  if (!cleaned.length) return "";
  return cleaned.length === 1 ? cleaned[0] : `(${cleaned.join(" OR ")})`;
}
const joinParts = (parts) => parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
const siteGroup = (sites) => !sites.length ? "" : (sites.length === 1 ? `site:${sites[0]}` : `(${sites.map((s) => `site:${s}`).join(" OR ")})`);

const PLATFORM_TARGETS = [
  { platform: "Google (LinkedIn x-ray)", sites: ["linkedin.com/in", "linkedin.com/pub"], purpose: "Public LinkedIn profiles via Google", tag: "general" },
  { platform: "LinkedIn (native boolean)", sites: [], nativeBoolean: true, purpose: "Paste into LinkedIn people search", tag: "general" },
  { platform: "Google (GitHub x-ray)", sites: ["github.com"], purpose: "Engineer profiles, READMEs, org membership", tag: "engineering" },
  { platform: "Google (Scholar/arXiv x-ray)", sites: ["scholar.google.com", "arxiv.org", "openreview.net"], purpose: "Research authors and publication records", tag: "research" },
  { platform: "Google (portfolio x-ray)", sites: ["behance.net", "dribbble.com"], purpose: "Design portfolios", tag: "design" },
  { platform: "Google (open web)", sites: [], purpose: "CVs, personal sites, rosters, directories", tag: "general" },
];
const VARIANT_SPECS = [
  { breadth: "narrow", expectedPrecision: "high", description: "Primary titles + all requirements" },
  { breadth: "balanced", expectedPrecision: "medium", description: "Titles incl. alternates + core requirements" },
  { breadth: "broad", expectedPrecision: "low", description: "All titles, requirements relaxed to an OR group" },
  { breadth: "adjacent", expectedPrecision: "low", description: "Adjacent-population titles + core skills" },
];

function variantParts(input, breadth) {
  const parts = [];
  const allTitles = [...input.titles, ...input.alternateTitles];
  if (breadth === "narrow") {
    parts.push(orGroup(input.titles));
    input.mustHave.forEach((m) => parts.push(quoteTerm(m)));
    parts.push(orGroup(input.anyOf), orGroup(input.credentials));
  } else if (breadth === "balanced") {
    parts.push(orGroup(allTitles));
    input.mustHave.slice(0, 2).forEach((m) => parts.push(quoteTerm(m)));
    parts.push(orGroup(input.anyOf));
  } else if (breadth === "broad") {
    parts.push(orGroup(allTitles), orGroup([...input.mustHave, ...input.anyOf]));
  } else if (breadth === "adjacent") {
    parts.push(orGroup(input.adjacentTitles.length ? input.adjacentTitles : input.alternateTitles));
    parts.push(orGroup([...input.mustHave, ...input.anyOf].slice(0, 6)));
  }
  parts.push(orGroup(input.locations));
  if (breadth === "narrow" && input.companies.length) parts.push(orGroup(input.companies));
  input.exclusions.forEach((e) => parts.push(`-${quoteTerm(e)}`));
  return parts;
}

/* Golden-test judge follow-ups baked in: relevant-platform filtering,
   cross-platform dedupe, and a visible Google ~32-word budget flag. */
function composeQueries(input, relevantTags) {
  const results = [];
  const seen = new Set();
  for (const target of PLATFORM_TARGETS) {
    if (target.tag !== "general" && relevantTags && !relevantTags.includes(target.tag)) continue;
    for (const spec of VARIANT_SPECS) {
      if (spec.breadth === "adjacent" && !input.adjacentTitles.length) continue;
      const site = target.nativeBoolean ? "" : siteGroup(target.sites);
      const query = joinParts([...variantParts(input, spec.breadth), site]);
      if (!query) continue;
      const dedupeKey = query.toLowerCase();
      if (seen.has(dedupeKey)) continue;
      seen.add(dedupeKey);
      const words = query.split(/\s+/).length;
      results.push({
        platform: target.platform, query, breadth: spec.breadth,
        purpose: `${target.purpose} — ${spec.description}`,
        expectedPrecision: spec.expectedPrecision,
        overBudget: !target.nativeBoolean && words > 32, words,
      });
    }
  }
  return results;
}

/* ── Storage: db capability with localStorage fallback ────────────────── */
const LS_KEY = "talentos-lite-v1";
let dbApi = null; // resolved db namespace or null

const localStore = {
  read() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null") || { searches: {} }; } catch { return { searches: {} }; } },
  write(data) { try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch { /* private mode etc. */ } },
};

const store = {
  async listSearches() {
    if (dbApi) {
      try { const snap = await dbApi.collection("searches").orderBy("createdAt", "desc").limit(200).get(); return snap.docs.map((d) => ({ id: d.id, ...d.data() })); }
      catch (e) { console.warn("db listSearches", e); }
    }
    const data = localStore.read();
    return Object.values(data.searches).map((s) => s.facts).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  },
  async saveSearch(facts) {
    if (dbApi) { try { await dbApi.doc("searches/" + facts.id).set(facts); return; } catch (e) { console.warn("db saveSearch", e); } }
    const data = localStore.read();
    data.searches[facts.id] = data.searches[facts.id] || { facts, artifacts: {}, candidates: {} };
    data.searches[facts.id].facts = facts;
    localStore.write(data);
  },
  async loadArtifacts(searchId) {
    if (dbApi) {
      try { const snap = await dbApi.doc("searches/" + searchId).collection("artifacts").get(); const out = {}; for (const d of snap.docs) out[d.id] = d.data(); return out; }
      catch (e) { console.warn("db loadArtifacts", e); }
    }
    return (localStore.read().searches[searchId] || {}).artifacts || {};
  },
  async saveArtifact(searchId, task, record) {
    if (dbApi) { try { await dbApi.doc(`searches/${searchId}/artifacts/${task}`).set(record); return; } catch (e) { console.warn("db saveArtifact", e); } }
    const data = localStore.read();
    if (!data.searches[searchId]) data.searches[searchId] = { facts: { id: searchId }, artifacts: {}, candidates: {} };
    data.searches[searchId].artifacts[task] = record;
    localStore.write(data);
  },
  async listCandidates(searchId) {
    if (dbApi) {
      try { const snap = await dbApi.doc("searches/" + searchId).collection("candidates").get(); return snap.docs.map((d) => ({ id: d.id, ...d.data() })); }
      catch (e) { console.warn("db listCandidates", e); }
    }
    return Object.values((localStore.read().searches[searchId] || {}).candidates || {});
  },
  async saveCandidate(searchId, cand) {
    if (dbApi) { try { await dbApi.doc(`searches/${searchId}/candidates/${cand.id}`).set(cand); return; } catch (e) { console.warn("db saveCandidate", e); } }
    const data = localStore.read();
    if (!data.searches[searchId]) data.searches[searchId] = { facts: { id: searchId }, artifacts: {}, candidates: {} };
    data.searches[searchId].candidates[cand.id] = cand;
    localStore.write(data);
  },
};

/* ── Example search (golden fixture; clearly marked, safe to delete) ──── */
const EXAMPLE_SEARCH = {
  id: "example-cais",
  example: true,
  name: "CAIS — Research Scientist / Research Engineer",
  companyName: "Center for AI Safety",
  roleTitle: "Research Scientist / Research Engineer",
  geography: "San Francisco, CA", country: "United States",
  industry: "AI safety research", seniority: "Senior",
  employmentType: "Permanent, full-time", compensationNote: "",
  businessObjective: "Expand empirical ML safety research capacity ahead of next benchmark cycle.",
  recruiterNotes: "",
  createdAt: "2026-09-01T00:00:00.000Z",
  jd: `The Center for AI Safety (CAIS) is hiring a Research Scientist or Research Engineer to advance empirical machine learning safety research in San Francisco.

You will design and run experiments on frontier-scale language models: adversarial robustness, dangerous-capability evaluations, unlearning, and benchmark construction. You will own projects end to end — forming hypotheses, building training and evaluation infrastructure, running large-scale experiments, and publishing at top venues.

We are looking for someone with a strong empirical research record (e.g., first-author publications at NeurIPS, ICML, ICLR, or equivalent impact through open-source research artifacts), excellent engineering ability in Python and PyTorch or JAX, and experience with distributed training or large-scale experiment orchestration. Research taste matters more to us than citation counts: we want people who pick important problems and execute quickly.

Familiarity with AI safety literature is preferred. A PhD is common among our researchers but not required — several of our strongest contributors came from engineering-heavy backgrounds. The role is on-site in San Francisco with competitive nonprofit compensation. Interest in reducing societal-scale risks from AI is essential.`,
};

/* ── Context assembly (ported from lib/ai/context) ────────────────────── */
function renderContext(search, artifacts) {
  const p = search;
  const facts = [
    `Search: ${p.name}`, `Company: ${p.companyName || "unknown"}`, `Role title: ${p.roleTitle}`,
    `Geography: ${p.geography || "unspecified"} (${p.country || "country unspecified"})`,
    p.industry ? `Industry: ${p.industry}` : "", p.seniority ? `Seniority: ${p.seniority}` : "",
    p.employmentType ? `Employment type: ${p.employmentType}` : "",
    p.compensationNote ? `Compensation: ${p.compensationNote}` : "",
    p.businessObjective ? `Business objective: ${p.businessObjective}` : "",
    p.recruiterNotes ? `Recruiter notes: ${p.recruiterNotes}` : "",
  ].filter(Boolean).join("\n");

  const sections = [`## Search project\n${facts}`];
  if (p.jd) sections.push(`## Job description (verbatim)\n${clip(p.jd, 6000)}`);
  const art = (key, title, budget) => {
    const rec = artifacts[key];
    if (rec && rec.payload) sections.push(`## ${title}\n${clip(JSON.stringify(rec.payload, null, 1), budget)}`);
  };
  art("role_intelligence", "Role intelligence (recruiter-reviewed)", 6000);
  const intake = artifacts.intake && artifacts.intake.payload;
  if (intake) {
    const answered = [];
    for (const cat of intake.categories || []) for (const q of cat.questions || [])
      if (q.answer && q.answer.trim()) answered.push(`Q (${cat.title}): ${q.question}\nA: ${q.answer}`);
    if (answered.length) sections.push(`## Hiring-manager intake answers\n${clip(answered.join("\n\n"), 6000)}`);
  }
  art("success_profile", "Success profile", 6000);
  art("market_intelligence", "Market intelligence", 5000);
  art("sourcing_strategy", "Sourcing strategy", 5000);
  return sections.join("\n");
}

/* ── AI task registry (prompts ported from lib/ai/tasks) ──────────────── */
function shapeCheck(payload, spec) {
  for (const [field, kind] of Object.entries(spec)) {
    const v = payload && payload[field];
    if (kind === "array" && !Array.isArray(v)) return `missing array field "${field}"`;
    if (kind === "string" && typeof v !== "string") return `missing string field "${field}"`;
    if (kind === "object" && (typeof v !== "object" || v === null)) return `missing object field "${field}"`;
  }
  return null;
}

/* ── Sample plumbing ──────────────────────────────────────────────────── */
let sampleApi = null; // resolved sample fn or null
let aiHidden = false; // set true on not_granted / sampling_disabled

const ERROR_COPY = {
  not_granted: "Claude access wasn't allowed for this page, so AI generation is off. Everything else still works.",
  sampling_disabled: "Claude isn't available on this account, so AI generation is off.",
  rate_limited: "Claude is rate-limited right now — wait a little and try again.",
  refused: "Claude declined this request. Edit the inputs and try a different framing.",
  invalid_json: "The reply wasn't valid JSON. Try again — if it keeps failing, trim the JD or notes.",
  prompt_too_large: "The assembled context is too large. Trim the JD or recruiter notes and retry.",
  empty_completion: "Claude produced no output. Try again with slightly different inputs.",
  cancelled: "Stopped.",
  upstream_error: "A transient error interrupted the call. Try again.",
};
const copyFor = (code) => ERROR_COPY[code] || ERROR_COPY.upstream_error;

async function runTask(taskKey, extraContext, ui, opts) {
  const task = TASKS[taskKey];
  const prompt = `${systemPrelude(task.persona)}

${task.rules}

${extraContext}

## Task
${task.ask}

## Output format
Reply with ONLY one JSON object (no markdown fences, no commentary) of this shape:
${task.shape}`;
  const ctl = new AbortController();
  if (ui && ui.bindStop) ui.bindStop(ctl);
  const payload = await sampleApi.json(prompt, {
    signal: ctl.signal,
    cache: opts && opts.regenerate ? false : true,
    onText: ui && ui.onText,
  });
  const err = task.check(payload);
  if (err) { const e = { code: "invalid_json", message: "shape: " + err, text: JSON.stringify(payload) }; throw e; }
  downgradeVerified(payload);
  return {
    payload,
    meta: { provider: "claude-artifact", generatedAt: new Date().toISOString() },
    traitWarnings: scanForProtectedTraits(payload),
  };
}

/* ── App state ────────────────────────────────────────────────────────── */
const state = {
  searches: [], current: null, artifacts: {}, candidates: [],
  module: "overview", storageMode: "local",
};

async function selectSearch(id) {
  state.current = state.searches.find((s) => s.id === id) || null;
  state.artifacts = state.current ? await store.loadArtifacts(id) : {};
  state.candidates = state.current ? await store.listCandidates(id) : [];
  state.module = "overview";
  render();
}

/* ── Rendering: shell ─────────────────────────────────────────────────── */
function render() {
  renderRail();
  renderMain();
}

function renderRail() {
  const list = $("#search-list");
  list.innerHTML = "";
  for (const s of state.searches) {
    const active = state.current && state.current.id === s.id;
    const item = el(`<button class="search-item ${active ? "active" : ""}">
      <div class="si-name">${esc(s.roleTitle)} ${s.example ? '<span class="chip example">example</span>' : ""}</div>
      <div class="si-sub">${esc(s.companyName || "")} · ${esc(s.geography || "")}</div>
    </button>`);
    item.onclick = () => selectSearch(s.id);
    list.append(item);
  }
  const nav = $("#mod-nav");
  nav.innerHTML = "";
  if (!state.current) return;
  for (const key of MODULE_ORDER) {
    const label = key === "overview" ? "Overview" : key === "candidates" ? "Candidates" : TASKS[key].label;
    const done = key === "overview" ? true : key === "candidates" ? state.candidates.length > 0 : Boolean(state.artifacts[key]);
    const item = el(`<button class="mod-item ${state.module === key ? "active" : ""}"><span class="dot ${done ? "done" : ""}"></span>${esc(label)}</button>`);
    item.onclick = () => { state.module = key; render(); };
    nav.append(item);
  }
  $("#rail-foot").textContent = state.storageMode === "db"
    ? "Saved to this artifact's private store. Nothing sends automatically."
    : "Saved in this browser only (offline mode). Nothing sends automatically.";
}

function renderMain() {
  const main = $("#main");
  main.innerHTML = "";
  if (!state.current) { main.append(renderNewSearchForm(true)); return; }
  if (state.module === "overview") return renderOverview(main);
  if (state.module === "candidates") return renderCandidates(main);
  renderTaskModule(main, state.module);
}

/* ── Module frame with generate / regenerate / edit JSON ──────────────── */
function renderTaskModule(main, key) {
  const task = TASKS[key];
  const rec = state.artifacts[key];
  main.append(el(`<div class="mod-head"><h2>${esc(task.label)}</h2>
    ${rec ? '<span class="chip inference">model inference</span>' : ""}
    <span class="spacer"></span></div>`));
  main.append(el(`<p class="mod-desc">${esc(task.desc)}</p>`));

  const head = $(".mod-head", main);
  const body = el(`<div></div>`);
  main.append(body);

  if (aiHidden) main.append(el(`<div class="notice warning">${esc(copyFor("not_granted"))}</div>`));

  const genBtn = el(`<button class="btn ${rec ? "" : "primary"}">${rec ? "Regenerate" : "Generate"}</button>`);
  const stopBtn = el(`<button class="btn small" hidden>Stop</button>`);
  if (!aiHidden && sampleApi) { head.append(genBtn, stopBtn); }

  let ctl = null;
  stopBtn.onclick = () => ctl && ctl.abort();

  genBtn.onclick = async () => {
    genBtn.disabled = true; stopBtn.hidden = false;
    body.innerHTML = "";
    const think = el(`<div class="panel"><div class="thinking">Generating ${esc(task.label.toLowerCase())} — Claude is thinking…</div><div class="stream"></div></div>`);
    body.append(think);
    const streamEl = $(".stream", think);
    try {
      const result = await runTask(key, renderContext(state.current, state.artifacts), {
        bindStop: (c) => { ctl = c; },
        onText: ({ text }) => { streamEl.textContent = text.slice(-1500); streamEl.scrollTop = streamEl.scrollHeight; },
      }, { regenerate: Boolean(rec) });
      state.artifacts[key] = result;
      await store.saveArtifact(state.current.id, key, result);
      render();
    } catch (e) {
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { aiHidden = true; }
      body.innerHTML = "";
      body.append(el(`<div class="notice error"><strong>Generation failed.</strong> ${esc(copyFor(e && e.code))}</div>`));
      if (rec) paintArtifact(body, key, rec);
      genBtn.disabled = false; stopBtn.hidden = true;
    }
  };

  if (rec) paintArtifact(body, key, rec);
  else body.append(el(`<div class="panel"><p class="why">Not generated yet. ${aiHidden || !sampleApi ? "AI generation is unavailable in this view." : "Generation runs on your Claude account — the first call asks for permission."}</p></div>`));
}

function paintArtifact(body, key, rec) {
  if (rec.traitWarnings && rec.traitWarnings.length) {
    body.append(el(`<div class="notice warning"><strong>Review required:</strong> the output mentions ${esc(rec.traitWarnings.join(", "))}. Protected characteristics must never drive evaluation — edit before use.</div>`));
  }
  const rendered = el(`<div></div>`);
  try { TASKS[key].render(rendered, rec.payload); }
  catch (e) { rendered.append(el(`<div class="notice error">Render failed (${esc(String(e && e.message))}) — use Edit JSON below.</div>`)); }
  body.append(rendered);

  const editWrap = el(`<div class="panel"><h4 style="margin-top:0">Edit JSON <span class="why">— the draft is yours; edits are saved verbatim</span></h4></div>`);
  const ta = el(`<textarea class="mono" rows="10"></textarea>`);
  ta.value = JSON.stringify(rec.payload, null, 2);
  const saveBtn = el(`<button class="btn small" style="margin-top:8px">Save edits</button>`);
  const msg = el(`<span class="why" style="margin-left:10px"></span>`);
  saveBtn.onclick = async () => {
    try {
      const payload = JSON.parse(ta.value);
      const err = TASKS[key].check(payload);
      if (err) { msg.textContent = "Not saved — " + err; return; }
      downgradeVerified(payload);
      rec.payload = payload;
      rec.meta = { ...(rec.meta || {}), editedAt: new Date().toISOString(), editedBy: "recruiter" };
      rec.traitWarnings = scanForProtectedTraits(payload);
      await store.saveArtifact(state.current.id, key, rec);
      render();
    } catch { msg.textContent = "Not saved — invalid JSON."; }
  };
  editWrap.append(ta, saveBtn, msg);
  body.append(editWrap);
  if (rec.meta) body.append(el(`<p class="why num">Generated ${esc(rec.meta.generatedAt || "")}${rec.meta.editedAt ? ` · edited ${esc(rec.meta.editedAt)}` : ""} · provider: ${esc(rec.meta.provider || "claude-artifact")}</p>`));
}

/* ── Renderers per artifact ───────────────────────────────────────────── */
const chipFor = (v) => {
  const cls = { strong: "ok", partial: "warn", missing: "bad", contradictory: "bad", unknown: "unknown",
    estimated: "warn", inferred: "unknown", high: "ok", medium: "warn", experimental: "unknown" }[v] || "unknown";
  return `<span class="chip ${cls}">${esc(v)}</span>`;
};
const provChip = (p) => `<span class="chip ${p === "model_inference" ? "inference" : ""}">${esc((p || "").replace("_", " "))}</span>`;
const tracedList = (items) => `<ul>${(items || []).map((i) => `<li>${esc(i.text)} ${provChip(i.provenance)}${i.note ? ` <span class="why">${esc(i.note)}</span>` : ""}</li>`).join("")}</ul>`;
const plainList = (items) => `<ul>${(items || []).map((i) => `<li>${esc(typeof i === "string" ? i : i.text)}</li>`).join("")}</ul>`;

function renderStrategy(root, p) {

function renderChannels(root, p) {
  root.append(el(`<div class="panel"><p class="why">${esc(p.reasoningSummary || "")}</p></div>`));
  const order = { high: 0, medium: 1, experimental: 2 };
  const channels = [...(p.channels || [])].sort((a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3));
  const panel = el(`<div class="panel"></div>`);
  for (const c of channels) {
    panel.append(el(`<div class="qrow"><div class="qmeta"><div class="plat">${esc(c.name)}</div>${chipFor(c.priority)} ${chipFor(c.certainty)} <span class="chip">${esc(c.costModel)}</span></div>
      <div style="flex:1"><div>${esc(c.whyRelevant)}</div>${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a> <span class="why">(unverified)</span>` : ""}</div></div>`));
  }
  root.append(panel);
}

function renderStrings(root, p) {
  const input = {
    titles: p.titles || [], alternateTitles: p.alternateTitles || [], adjacentTitles: p.adjacentTitles || [],
    mustHave: p.mustHave || [], anyOf: p.anyOf || [], credentials: p.credentials || [],
    locations: p.locations || [], companies: p.companies || [], exclusions: p.exclusions || [],
  };
  const composed = composeQueries(input, ["general", ...(p.relevantPlatforms || [])]);
  const panel = el(`<div class="panel"><h3>Composed matrix <span class="why num">— ${composed.length} deterministic variants, deduped</span></h3></div>`);
  for (const q of composed) {
    const row = el(`<div class="qrow"><div class="qmeta"><div class="plat">${esc(q.platform)}</div>${chipFor(q.expectedPrecision)} <span class="chip">${esc(q.breadth)}</span>${q.overBudget ? ' <span class="chip warn">&gt;32 words</span>' : ""}</div>
      <pre class="mono">${esc(q.query)}</pre></div>`);
    const btn = el(`<button class="btn small">Copy</button>`);
    btn.onclick = () => copyText(q.query, btn);
    row.append(btn);
    panel.append(row);
  }
  root.append(panel);
  if ((p.extraQueries || []).length) {
    const extra = el(`<div class="panel"><h3>Platform-specific queries <span class="why">— model-suggested, verify the platform before relying on it</span></h3></div>`);
    for (const q of p.extraQueries) {
      const row = el(`<div class="qrow"><div class="qmeta"><div class="plat">${esc(q.platform)}</div><span class="chip">${esc(q.breadth || "")}</span><div class="why">${esc(q.purpose || "")}</div></div>
        <pre class="mono">${esc(q.query)}</pre></div>`);
      const btn = el(`<button class="btn small">Copy</button>`);
      btn.onclick = () => copyText(q.query, btn);
      row.append(btn);
      extra.append(row);
    }
    root.append(extra);
  }
  if (composed.some((q) => q.overBudget)) root.append(el(`<div class="notice warning">Queries flagged <b>&gt;32 words</b> exceed Google's effective term limit and will silently truncate — trim before running.</div>`));
}

/* ── Overview module ──────────────────────────────────────────────────── */
function factsForm(s, onSave, isNew) {
  const f = el(`<div class="panel"><div class="form-grid"></div></div>`);
  const grid = $(".form-grid", f);
  const fields = [
    ["name", "Search name"], ["companyName", "Company"], ["roleTitle", "Role title"],
    ["geography", "Geography"], ["country", "Country"], ["industry", "Industry"],
    ["seniority", "Seniority"], ["employmentType", "Employment type"],
    ["compensationNote", "Compensation note"], ["businessObjective", "Business objective"],
  ];
  const inputs = {};
  for (const [key, label] of fields) {
    const w = el(`<label class="field"><b>${esc(label)}</b></label>`);
    const input = el(`<input type="text">`);
    input.value = s[key] || "";
    inputs[key] = input; w.append(input); grid.append(w);
  }
  const jdW = el(`<label class="field" style="grid-column:1/-1"><b>Job description (paste)</b></label>`);
  const jd = el(`<textarea rows="8"></textarea>`); jd.value = s.jd || ""; jdW.append(jd); grid.append(jdW);
  const notesW = el(`<label class="field" style="grid-column:1/-1"><b>Recruiter notes</b></label>`);
  const notes = el(`<textarea rows="2"></textarea>`); notes.value = s.recruiterNotes || ""; notesW.append(notes); grid.append(notesW);
  const save = el(`<button class="btn primary">${isNew ? "Create search" : "Save"}</button>`);
  save.onclick = () => {
    for (const [key] of fields) s[key] = inputs[key].value.trim();
    s.jd = jd.value; s.recruiterNotes = notes.value.trim();
    if (!s.roleTitle) { save.textContent = "Role title is required"; return; }
    if (!s.name) s.name = `${s.companyName || "Search"} — ${s.roleTitle}`;
    onSave(s);
  };
  f.append(save);
  return f;
}

function renderNewSearchForm(standalone) {
  const wrap = el(`<div><div class="mod-head"><h2>New search</h2></div>
    <p class="mod-desc">One search = one hiring need. The facts and JD you enter here become the context for every generated module.</p></div>`);
  const s = { id: uid(), createdAt: new Date().toISOString() };
  wrap.append(factsForm(s, async (saved) => {
    await store.saveSearch(saved);
    state.searches.unshift(saved);
    await selectSearch(saved.id);
  }, true));
  if (standalone && state.searches.length) wrap.append(el(`<p class="why">…or pick an existing search from the left rail.</p>`));
  return wrap;
}

function renderOverview(main) {
  const s = state.current;
  main.append(el(`<div class="mod-head"><h2>${esc(s.name)}</h2>${s.example ? '<span class="chip example">example data</span>' : ""}</div>`));
  main.append(el(`<p class="mod-desc">Everything below is the shared context for generation. Edit facts here; each module then generates from the latest state — role intelligence first, then intake, and onward down the rail.</p>`));
  if (s.example) main.append(el(`<div class="notice">This is a bundled example search (a public CAIS job description) so the workroom isn't empty on first open. Create your own search from the rail — nothing here is your data.</div>`));
  main.append(factsForm(s, async (saved) => { await store.saveSearch(saved); render(); }, false));
  const done = MODULE_ORDER.filter((k) => k !== "overview" && k !== "candidates" && state.artifacts[k]).length;
  main.append(el(`<div class="panel"><h3>Pipeline</h3><p class="num">${done} of ${MODULE_ORDER.length - 2} modules generated · ${state.candidates.length} candidate${state.candidates.length === 1 ? "" : "s"}</p>
    <p class="why">Suggested order: Role Intelligence → HM Intake (answer the questions) → Success Profile → Market Intel → Strategy → Channels → Search Strings → Candidates.</p></div>`));
}

/* ── Candidates module ────────────────────────────────────────────────── */
function candidateContext(cand) {
  const lines = [
    `Name: ${cand.name}`,
    cand.currentTitle ? `Current title: ${cand.currentTitle}` : "",
    cand.currentCompany ? `Current company: ${cand.currentCompany}` : "",
    cand.geography ? `Geography: ${cand.geography}` : "",
    (cand.profileUrls || []).length ? `Profile URLs: ${cand.profileUrls.join(", ")}` : "",
    cand.notes ? `Recruiter notes: ${cand.notes}` : "",
    cand.pastedText ? `Resume / pasted profile text:\n${clip(cand.pastedText, 6000)}` : "",
  ].filter(Boolean).join("\n");
  return `## Candidate\n${lines}`;
}

const CANDIDATE_TASKS = {
  evidence: {
    label: "Evidence alignment",
    persona: "a talent researcher performing evidence alignment",
    rules: `This is recruiter decision support, NOT candidate selection. Compare the candidate's observable, job-related professional evidence against the search's success-profile criteria.
For each relevant criterion produce an item:
- status: "strong" (clear supporting evidence in the provided material), "partial", "missing" (criterion matters, no evidence found — absence of evidence, not evidence of absence), "contradictory", "unknown".
- evidenceText: quote or precisely describe the evidence FROM THE PROVIDED MATERIAL ONLY. Never invent facts about this person. For "missing"/"unknown", say what was looked for and not found.
- reviewPriority.suggestion is advisory only ("review_first"|"review"|"review_later") with reasoning; the recruiter decides.`,
    ask: "Produce the evidence alignment for this candidate now.",
    shape: `{"items": [{"criterion": string, "status": "strong"|"partial"|"missing"|"contradictory"|"unknown", "evidenceText": string}], "reviewPriority": {"suggestion": "review_first"|"review"|"review_later", "reasoning": string}, "questionsToValidate": string[]}`,
    check: (p) => shapeCheck(p, { items: "array", reviewPriority: "object" }),
  },
  outreach: {
    label: "Outreach drafts",
    persona: "an elite candidate-engagement writer",
    rules: `Draft a full outreach sequence for this candidate: email_1, follow_up_1, follow_up_2, follow_up_3, breakup, plus linkedin_connect (≤300 chars) and inmail. Nothing sends automatically — these are drafts the recruiter copies out.
Non-negotiables:
- NEVER invent facts about the candidate. Personalize ONLY from the provided evidence items and candidate material. Every personalization gets a citations entry: {personalization, evidence}. If there is no real evidence, write honest, direct outreach without fake familiarity — and say so in cadenceRationale.
- Subject lines: 2–3 variants per email step, none clickbait.
- Voice: direct, specific, peer-to-peer; match the seniority.
- dayOffset per step. Default cadence 0/3/7/12/20 — ADAPT to seniority, scarcity, channel; explain in cadenceRationale.
- No manipulation, no false urgency, no deceptive pressure. Include a respectful opt-out in the breakup step.`,
    ask: "Draft the complete outreach sequence for this candidate now.",
    shape: `{"steps": [{"kind": "email_1"|"follow_up_1"|"follow_up_2"|"follow_up_3"|"breakup"|"linkedin_connect"|"inmail", "dayOffset": number, "subjectVariants": string[], "body": string, "citations": [{"personalization": string, "evidence": string}]}], "cadenceRationale": string}`,
    check: (p) => shapeCheck(p, { steps: "array", cadenceRationale: "string" }),
  },
};

async function runCandidateTask(taskKey, cand, ui) {
  const task = CANDIDATE_TASKS[taskKey];
  const evidencePart = taskKey === "outreach" && cand.evidence
    ? `\n## Evidence available for personalization\n${clip(JSON.stringify(cand.evidence.payload.items, null, 1), 4000)}` : "";
  const prompt = `${systemPrelude(task.persona)}

${task.rules}

${renderContext(state.current, state.artifacts)}

${candidateContext(cand)}${evidencePart}

## Task
${task.ask}

## Output format
Reply with ONLY one JSON object (no markdown fences, no commentary) of this shape:
${task.shape}`;
  const ctl = new AbortController();
  if (ui && ui.bindStop) ui.bindStop(ctl);
  const payload = await sampleApi.json(prompt, { signal: ctl.signal, cache: false, onText: ui && ui.onText });
  const err = task.check(payload);
  if (err) throw { code: "invalid_json", message: err };
  downgradeVerified(payload);
  return { payload, meta: { provider: "claude-artifact", generatedAt: new Date().toISOString() }, traitWarnings: scanForProtectedTraits(payload) };
}

function renderCandidates(main) {
  main.append(el(`<div class="mod-head"><h2>Candidates</h2></div>`));
  main.append(el(`<p class="mod-desc">Paste what's publicly observable, then compare it to the success profile. Evidence alignment is advisory decision support — you decide, and everything is editable. Profiles link out; nothing is fetched or scraped.</p>`));

  const form = el(`<div class="panel"><h3>Add candidate</h3><div class="form-grid"></div></div>`);
  const grid = $(".form-grid", form);
  const inputs = {};
  for (const [key, label] of [["name", "Name"], ["currentTitle", "Current title"], ["currentCompany", "Current company"], ["geography", "Geography"], ["profileUrl", "Profile URL"], ["notes", "Recruiter notes"]]) {
    const w = el(`<label class="field"><b>${esc(label)}</b></label>`);
    inputs[key] = el(`<input type="text">`); w.append(inputs[key]); grid.append(w);
  }
  const pw = el(`<label class="field" style="grid-column:1/-1"><b>Pasted profile / resume text</b></label>`);
  const pasted = el(`<textarea rows="5"></textarea>`); pw.append(pasted); grid.append(pw);
  const addBtn = el(`<button class="btn primary">Add candidate</button>`);
  addBtn.onclick = async () => {
    if (!inputs.name.value.trim()) { addBtn.textContent = "Name is required"; return; }
    const cand = {
      id: uid(), name: inputs.name.value.trim(), currentTitle: inputs.currentTitle.value.trim(),
      currentCompany: inputs.currentCompany.value.trim(), geography: inputs.geography.value.trim(),
      profileUrls: inputs.profileUrl.value.trim() ? [inputs.profileUrl.value.trim()] : [],
      notes: inputs.notes.value.trim(), pastedText: pasted.value, createdAt: new Date().toISOString(),
    };
    await store.saveCandidate(state.current.id, cand);
    state.candidates.push(cand);
    render();
  };
  form.append(addBtn);
  main.append(form);

  const list = el(`<div class="cand-list"></div>`);
  for (const cand of state.candidates) list.append(renderCandidateCard(cand));
  main.append(list);
}

function renderCandidateCard(cand) {
  const card = el(`<div class="panel"></div>`);
  const head = el(`<div class="mod-head" style="margin:0 0 6px"><h3 style="margin:0">${esc(cand.name)}</h3>
    <span class="why">${esc([cand.currentTitle, cand.currentCompany, cand.geography].filter(Boolean).join(" · "))}</span>
    <span class="spacer"></span></div>`);
  card.append(head);
  for (const url of cand.profileUrls || []) card.append(el(`<p><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></p>`));

  const body = el(`<div></div>`);
  card.append(body);

  const paint = () => {
    body.innerHTML = "";
    if (cand.evidence) {
      const p = cand.evidence.payload;
      body.append(el(`<h4>Evidence vs success profile <span class="chip inference">model inference</span> ${chipFor((p.reviewPriority || {}).suggestion === "review_first" ? "strong" : "partial")}</h4>`));
      body.append(el(`<ul>${(p.items || []).map((i) => `<li><b>${esc(i.criterion)}</b> ${chipFor(i.status)}<div class="why">${esc(i.evidenceText)}</div></li>`).join("")}</ul>`));
      body.append(el(`<p class="why"><b>Suggested review priority (advisory):</b> ${esc((p.reviewPriority || {}).suggestion || "")} — ${esc((p.reviewPriority || {}).reasoning || "")}</p>`));
      if ((p.questionsToValidate || []).length) body.append(el(`<p class="why"><b>Validate:</b> ${esc(p.questionsToValidate.join(" · "))}</p>`));
    }
    if (cand.outreach) {
      const p = cand.outreach.payload;
      body.append(el(`<h4>Outreach drafts <span class="chip inference">model inference</span> <span class="why">nothing sends automatically</span></h4>`));
      for (const step of p.steps || []) {
        const stepEl = el(`<div class="qrow"><div class="qmeta"><div class="plat">${esc(step.kind)}</div><span class="chip num">day ${esc(String(step.dayOffset))}</span></div>
          <div style="flex:1">${(step.subjectVariants || []).length ? `<div class="why">Subj: ${esc(step.subjectVariants.join(" / "))}</div>` : ""}<pre class="mono">${esc(step.body)}</pre></div></div>`);
        const btn = el(`<button class="btn small">Copy</button>`);
        btn.onclick = () => copyText(step.body, btn);
        stepEl.append(btn);
        body.append(stepEl);
      }
      body.append(el(`<p class="why">Cadence: ${esc(p.cadenceRationale || "")}</p>`));
    }
  };
  paint();

  if (sampleApi && !aiHidden) {
    const evBtn = el(`<button class="btn small">${cand.evidence ? "Re-run evidence" : "Evidence alignment"}</button>`);
    const orBtn = el(`<button class="btn small">${cand.outreach ? "Re-draft outreach" : "Draft outreach"}</button>`);
    const status = el(`<span class="why"></span>`);
    head.append(evBtn, orBtn, status);
    const run = async (key, btn) => {
      if (key === "evidence" && !state.artifacts.success_profile) { status.textContent = "Generate the Success Profile first."; return; }
      btn.disabled = true; status.textContent = "Thinking…";
      try {
        const result = await runCandidateTask(key, cand, {});
        cand[key] = result;
        await store.saveCandidate(state.current.id, cand);
        status.textContent = ""; btn.disabled = false;
        btn.textContent = key === "evidence" ? "Re-run evidence" : "Re-draft outreach";
        paint();
      } catch (e) {
        if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) aiHidden = true;
        status.textContent = copyFor(e && e.code); btn.disabled = false;
      }
    };
    evBtn.onclick = () => run("evidence", evBtn);
    orBtn.onclick = () => run("outreach", orBtn);
  }
  return card;
}

/* ── Boot ─────────────────────────────────────────────────────────────── */
$("#new-search-btn").onclick = () => { state.current = null; state.module = "overview"; const main = $("#main"); main.innerHTML = ""; main.append(renderNewSearchForm(false)); renderRail(); };

(async function boot() {
  // Render immediately from local data; light capabilities up as they resolve.
  state.searches = await store.listSearches();
  if (!state.searches.length) { await store.saveSearch(EXAMPLE_SEARCH); state.searches = [EXAMPLE_SEARCH]; }
  await selectSearch(state.searches[0].id);

  const [db, sample] = await Promise.all([
    window.claude ? claude.use("db") : Promise.resolve(null),
    window.claude ? claude.use("sample") : Promise.resolve(null),
  ]);
  sampleApi = sample;
  if (db) {
    dbApi = db; state.storageMode = "db";
    // Migrate: make sure the example exists in db, then reload from db.
    const existing = await store.listSearches();
    if (!existing.length) await store.saveSearch(EXAMPLE_SEARCH);
    state.searches = await store.listSearches();
    await selectSearch((state.current && state.searches.find((s) => s.id === state.current.id)) ? state.current.id : state.searches[0].id);
  } else {
    render(); // repaint with sample availability known
  }
  if (!sample) { aiHidden = true; render(); }
})();
</script>
