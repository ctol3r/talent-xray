<title>TalentOS Lite</title>
<style>
  /* ── Tokens: dark-first workroom; light is the swapped set ─────────── */
  :root {
    --ink: #10151b;
    --surface: #171e26;
    --surface-2: #1d2630;
    --line: #2a3440;
    --line-soft: #222b35;
    --text: #e7ecf1;

    --faint: #5f6b77;

    --accent-ink: #10151b;

    --ok: #5cbe8f;
    --warn: #d9b54a;
    --bad: #d97762;
    --unknown: #7e8b98;
    --chip-ink: #10151b;

    --sans: "Archivo", system-ui, "Segoe UI", sans-serif;

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #f5f3ee;
      --surface: #fdfcf9;
      --surface-2: #efece4;
      --line: #d8d2c6;
      --line-soft: #e5e0d6;
      --text: #23292f;
      --muted: #68727c;
      --faint: #98a0a9;
      --accent: #c07d17;
      --accent-ink: #fdfcf9;
      --accent-soft: rgba(192, 125, 23, 0.1);
      --ok: #2e8f63;
      --warn: #9c7c1c;
      --bad: #b6503a;
      --unknown: #6d7883;
      --chip-ink: #fdfcf9;
    }
  }
  :root[data-theme="light"] {
    --ink: #f5f3ee;
    --surface: #fdfcf9;
    --surface-2: #efece4;
    --line: #d8d2c6;
    --line-soft: #e5e0d6;
    --text: #23292f;
    --muted: #68727c;
    --faint: #98a0a9;
    --accent: #c07d17;
    --accent-ink: #fdfcf9;
    --accent-soft: rgba(192, 125, 23, 0.1);
    --ok: #2e8f63;
    --warn: #9c7c1c;
    --bad: #b6503a;
    --unknown: #6d7883;
    --chip-ink: #fdfcf9;
  }

  * {
    box-sizing: border-box;
  }
  html {
    height: 100%;
  }
  body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  #app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Rail ──────────────────────────────────────────────────────────── */
  .rail {
    width: 252px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--surface);
    overflow-y: auto;
  }
  .brand {
    padding: 16px 16px 10px;
    border-bottom: 1px solid var(--line-soft);
  }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .brand h1 span {
    color: var(--accent);
  }
  .brand small {
    color: var(--muted);
    font-size: 11px;
    display: block;
    margin-top: 2px;
  }
  .rail-section {
    padding: 12px 10px 4px;
  }
  .rail-label {
    font: 600 10px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--faint);

  }
  .search-item {

  textarea,

<div id="app">
  <nav class="rail">
    <div class="brand">
      <h1>Talent<span>OS</span> Lite</h1>
      <small>AI recruiting workroom · runs on your Claude</small>
    </div>
    <div class="rail-section">
      <div class="rail-label">Searches</div>
      <div id="search-list"></div>
      <button class="btn small" id="new-search-btn" style="margin: 8px 6px 0">
        + New search
      </button>
    </div>
    <div class="rail-section">
      <div class="rail-label">Modules</div>
      <div class="modnav" id="mod-nav"></div>
    </div>

      Nothing sends automatically. Every AI draft is editable.

<script>
  "use strict";
  /* TalentOS Lite — artifact companion to the local TalentOS app.
   AI via the `sample` capability (viewer's own Claude — no API key);
   persistence via `db` with a localStorage fallback. Prompts and the
   deterministic query composer are ported from the repo (talentos/src). */

  /* ── Utilities ─────────────────────────────────────────────────────────── */
  const $ = (sel, el) => (el || document).querySelector(sel);
  const esc = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  const uid = () =>
    Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const clip = (s, n) => {
    s = String(s ?? "");
    return s.length > n ? s.slice(0, n) + "\n…[truncated]" : s;
  };

  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      if (btn) {
        const old = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => {
          btn.textContent = old;
        }, 1200);
      }
    } catch {
      if (btn) btn.textContent = "Copy failed";
    }
  }

  /* ── Fair hiring + data honesty (ported from lib/domain/fair-hiring) ──── */
  const PROTECTED_TRAITS = [
    "race",
    "ethnicity",
    "religion",
    "age",
    "gender identity",
    "disability",
    "national origin",
    "sexual orientation",
    "health condition",
    "pregnancy",
    "family status",
    "marital status",
    "political affiliation",
    "veteran status",
  ];
  const NON_INFERENCE = `Fair-hiring constraints (mandatory):
- Never infer, mention, request, or reason about protected characteristics: ${PROTECTED_TRAITS.join(", ")}.
- Evaluate and describe candidates only through job-related professional evidence that is observable in the provided material.
- Never recommend rejecting, deprioritizing, or preferring anyone on the basis of a protected characteristic.
- If provided material contains protected-characteristic information, ignore it entirely; do not repeat it in output.
- All output is advisory decision support for a human recruiter; never phrase output as an employment decision.`;

  function systemPrelude(persona) {
    return `You are ${persona} working inside a recruiting workroom used by one professional recruiter. Your output is decision support the recruiter will review and edit — write with the judgment of an elite practitioner, not the caution of a form letter.

${NON_INFERENCE}

Data honesty (mandatory):
- Never fabricate facts, statistics, URLs, or claims about specific real people.
- You have no live web access. Never label anything "verified" — that label is reserved for claims a human confirmed against a source. Use "estimated" for order-of-magnitude professional judgment, "inferred" for reasoned guesses, "unknown" when you cannot know. "Reliable exact data unavailable" is a valid, welcome answer.
- Surface your assumptions and open questions explicitly instead of projecting false confidence.
- Adapt everything to THIS role, company, seniority, geography, and industry. Generic recruiting boilerplate is a failure.
Everything you produce is a draft the recruiter can edit; write content that is specific enough to be worth editing.`;
  }

  /* Word-boundary trait scan (ported from lib/domain/fair-hiring — the
     naive substring version false-positived on words like "language"). A
     hit is a mandatory-review flag, not a block. */
  const TRAIT_SCAN_PATTERNS = [
    ["race/ethnicity", /\brace\b|\bethnicit/i],
    ["religion", /\breligio(n|us)\b/i],
    ["age", /\bage\b|\byears?\s+old\b/i],
    ["gender identity", /\bgender\b/i],
    [
      "disability/health",
      /\bdisabilit|\bdisabled\b|\bmedical condition\b|\bhealth condition\b/i,
    ],
    ["national origin", /\bnational origin\b/i],
    ["sexual orientation", /\bsexual orientation\b/i],
    ["pregnancy/family status", /\bpregnan|\bmarital\b|\bfamily status\b/i],
    ["political affiliation", /\bpolitical (affiliation|beliefs?|views?)\b/i],
    ["veteran status", /\bveteran status\b/i],
  ];
  function scanForProtectedTraits(value) {
    const text = JSON.stringify(value);
    return TRAIT_SCAN_PATTERNS.filter(([, re]) => re.test(text)).map(
      ([trait]) => trait,
    );
  }

  /* Model output may never claim "verified" (NO FAKE DATA). Returns how many
   labels had to be downgraded — the golden test treats any as a guardrail hit. */
  function downgradeVerified(node) {
    let count = 0;
    if (Array.isArray(node)) {
      for (const child of node) count += downgradeVerified(child);
      return count;
    }
    if (node && typeof node === "object") {
      if (node.certainty === "verified") {
        node.certainty = "inferred";
        node.note = (
          (node.note || "") +
          " [downgraded from 'verified' — model output cannot verify]"
        ).trim();
        count += 1;
      }
      for (const child of Object.values(node))
        count += downgradeVerified(child);
    }
    return count;
  }

  /* ── Canonical IR hygiene (ported from lib/domain/intake-hygiene) ─────
     Deterministic backstops behind the reasoner's own rules, from the W12
     full-corpus taxonomy (eval/w12/REPORT.md §12.1, D-015/D-016). Each one
     corrects a specific unambiguous shape and leaves everything else alone:
     a rule stated to a model is not a guarantee, and these are the part that
     can be enforced without one. */

  const irNorm = (x) =>
    String(x || "")
      .toLowerCase()
      .replace(/[“”"]/g, '"')
      .replace(/[‘’]/g, "'")
      .replace(/\s+/g, " ")
      .trim();

  const irTokens = (text) =>
    new Set(
      irNorm(text)
        .split(/[^a-z0-9]+/)
        .filter((t) => t.length >= 4),
    );

  function irVerbatimFrom(statement, sources) {
    const needle = irNorm(statement).replace(/^["'\s]+|["'\s]+$/g, "");
    if (needle.length < 12) return true; // too short to attribute either way
    return sources.some((src) => irNorm(src).includes(needle));
  }

  /* S-2 · `statement` and `origin` move together. A requirement claiming JD
     origin whose statement is verbatim from a manager statement instead has
     its origin flipped and the speaker recorded. */
  function reconcileRequirementOrigins(requirements, jdText, statements) {
    if (!statements.length) return requirements;
    const jdSources = jdText ? [jdText] : [];
    return requirements.map((r) => {
      if (r.origin !== "jd") return r;
      if (irVerbatimFrom(r.statement, jdSources)) return r;
      const said = statements.find((st) =>
        irVerbatimFrom(r.statement, [st.text]),
      );
      if (!said) return r;
      return {
        ...r,
        origin: "manager_statement",
        assertedBy: r.assertedBy || said.speaker,
      };
    });
  }

  /* S-4 · A withdrawn requirement leaves the set. "preferred" legitimately
     raises a candidate's review priority, so keeping one still shapes the
     search. Matched narrowly on the label: no live requirement is *named*
     withdrawn. */
  const dropWithdrawnRequirements = (requirements) =>
    requirements.filter((r) => !/\bwithdrawn\b/i.test(r.label || ""));

  /* S-10 · One requirement, one source phrase. The reasoner tends to paste a
     whole multi-topic turn onto every requirement it touched — 24.5% of them
     in the W12 corpus — which destroys the provenance the field exists for.
     Narrows only when one sentence clearly wins; the result is always a
     verbatim substring of the original. */
  function narrowSharedStatements(requirements) {
    const counts = new Map();
    for (const r of requirements) {
      const k = irNorm(r.statement);
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    return requirements.map((r) => {
      if ((counts.get(irNorm(r.statement)) || 0) < 2) return r;
      const sentences = String(r.statement || "")
        .split(/(?<=[.!?])\s+/)
        .map((x) => x.trim())
        .filter((x) => x.length >= 12);
      if (sentences.length < 2) return r;
      const wanted = irTokens(r.label);
      if (!wanted.size) return r;
      const scored = sentences.map((sentence) => ({
        sentence,
        score: [...irTokens(sentence)].filter((t) => wanted.has(t)).length,
      }));
      const best = Math.max(...scored.map((x) => x.score));
      if (best === 0) return r;
      const winners = scored.filter((x) => x.score === best);
      if (winners.length !== 1) return r;
      return { ...r, statement: winners[0].sentence };
    });
  }

  /* S-3 · A comparison with the outside market cannot be closed from inside
     the company. The manager's own figure answers one side; the other needs
     market evidence. Deliberately narrow — a comparison, not a mention. */
  const MARKET_COMPARISON =
    /\bcompare[sd]?\b|\bcomparison\b|\bversus\b|\bagainst the (?:market|region)|\b(?:market|regional|prevailing|going) rate\b|\bmarket[- ]competitive\b/i;

  function keepMarketComparisonsOpen(uncertainties, before) {
    const wasOpen = new Set(
      (before || [])
        .filter((u) => u.status === "open")
        .map((u) => u.id || u.about),
    );
    return uncertainties.map((u) => {
      if (u.status !== "resolved") return u;
      if (!wasOpen.has(u.id || u.about)) return u;
      if (!MARKET_COMPARISON.test(u.about || "")) return u;
      const kept = u.resolution
        ? `${u.consequence} The hiring manager has stated the internal figure ("${String(u.resolution).trim()}"), which is one side of the comparison; the market side is still unknown and only market evidence can close it.`
        : u.consequence;
      const out = { ...u, status: "open", consequence: kept };
      delete out.resolution;
      return out;
    });
  }

  /* All four, applied to one reasoning turn's output. */
  function applyIntakeHygiene(next, beforeUncertainties, jdText, statements) {
    return {
      requirements: narrowSharedStatements(
        dropWithdrawnRequirements(
          reconcileRequirementOrigins(
            next.requirements || [],
            jdText,
            statements || [],
          ),
        ),
      ),
      uncertainties: keepMarketComparisonsOpen(
        next.uncertainties || [],
        beforeUncertainties || [],
      ),
    };
  }

  /* ── Deterministic composer (ported from lib/domain/search-strings) ───── */
  function quoteTerm(term) {
    const t = String(term).trim();
    if (!t) return "";
    if (/^[-"(]/.test(t) || /^\w+:/.test(t)) return t;
    return /\s/.test(t) ? `"${t.replace(/"/g, "")}"` : t;
  }
  function orGroup(terms) {
    const cleaned = (terms || [])
      .filter(Boolean)
      .map(quoteTerm)
      .filter(Boolean);
    if (!cleaned.length) return "";
    return cleaned.length === 1 ? cleaned[0] : `(${cleaned.join(" OR ")})`;
  }
  const joinParts = (parts) =>
    parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
  const siteGroup = (sites) =>
    !sites.length
      ? ""
      : sites.length === 1
        ? `site:${sites[0]}`
        : `(${sites.map((s) => `site:${s}`).join(" OR ")})`;

  const PLATFORM_TARGETS = [
    {
      platform: "Google (LinkedIn x-ray)",
      sites: ["linkedin.com/in", "linkedin.com/pub"],
      purpose: "Public LinkedIn profiles via Google",
      tag: "general",
    },
    {
      platform: "LinkedIn (native boolean)",
      sites: [],
      nativeBoolean: true,
      purpose: "Paste into LinkedIn people search",
      tag: "general",
    },
    {
      platform: "Google (GitHub x-ray)",
      sites: ["github.com"],
      purpose: "Engineer profiles, READMEs, org membership",
      tag: "engineering",
    },
    {
      platform: "Google (Scholar/arXiv x-ray)",
      sites: ["scholar.google.com", "arxiv.org", "openreview.net"],
      purpose: "Research authors and publication records",
      tag: "research",
    },
    {
      platform: "Google (portfolio x-ray)",
      sites: ["behance.net", "dribbble.com"],
      purpose: "Design portfolios",
      tag: "design",
    },
    {
      platform: "Google (open web)",
      sites: [],
      purpose: "CVs, personal sites, rosters, directories",
      tag: "general",
    },
  ];
  const VARIANT_SPECS = [
    {
      breadth: "narrow",
      expectedPrecision: "high",
      description: "Primary titles + all requirements",
    },
    {
      breadth: "balanced",
      expectedPrecision: "medium",
      description: "Titles incl. alternates + core requirements",
    },
    {
      breadth: "broad",
      expectedPrecision: "low",
      description: "All titles, requirements relaxed to an OR group",
    },
    {
      breadth: "adjacent",
      expectedPrecision: "low",
      description: "Adjacent-population titles + core skills",
    },
  ];

  function variantParts(input, breadth) {
    const parts = [];
    const allTitles = [...input.titles, ...input.alternateTitles];
    if (breadth === "narrow") {
      parts.push(orGroup(input.titles));
      input.mustHave.forEach((m) => parts.push(quoteTerm(m)));
      parts.push(orGroup(input.anyOf), orGroup(input.credentials));
    } else if (breadth === "balanced") {
      parts.push(orGroup(allTitles));
      input.mustHave.slice(0, 2).forEach((m) => parts.push(quoteTerm(m)));
      parts.push(orGroup(input.anyOf));
    } else if (breadth === "broad") {
      parts.push(
        orGroup(allTitles),
        orGroup([...input.mustHave, ...input.anyOf]),
      );
    } else if (breadth === "adjacent") {
      parts.push(
        orGroup(
          input.adjacentTitles.length
            ? input.adjacentTitles
            : input.alternateTitles,
        ),
      );
      parts.push(orGroup([...input.mustHave, ...input.anyOf].slice(0, 6)));
    }
    parts.push(orGroup(input.locations));
    if (breadth === "narrow" && input.companies.length)
      parts.push(orGroup(input.companies));
    input.exclusions.forEach((e) => parts.push(`-${quoteTerm(e)}`));
    return parts;
  }

  /* Golden-test judge follow-ups baked in: relevant-platform filtering,
   cross-platform dedupe, and a visible Google ~32-word budget flag. */
  function composeQueries(input, relevantTags) {
    const results = [];
    const seen = new Set();
    for (const target of PLATFORM_TARGETS) {
      if (
        target.tag !== "general" &&
        relevantTags &&
        !relevantTags.includes(target.tag)
      )
        continue;
      for (const spec of VARIANT_SPECS) {
        if (spec.breadth === "adjacent" && !input.adjacentTitles.length)
          continue;
        const site = target.nativeBoolean ? "" : siteGroup(target.sites);
        const query = joinParts([...variantParts(input, spec.breadth), site]);
        if (!query) continue;
        const dedupeKey = query.toLowerCase();
        if (seen.has(dedupeKey)) continue;
        seen.add(dedupeKey);
        const words = query.split(/\s+/).length;
        results.push({
          platform: target.platform,
          query,
          breadth: spec.breadth,
          purpose: `${target.purpose} — ${spec.description}`,
          expectedPrecision: spec.expectedPrecision,
          overBudget: !target.nativeBoolean && words > 32,
          words,
        });
      }
    }
    return results;
  }

  /* ── Example search (golden fixture; clearly marked, safe to delete) ──── */

  /* ── Context assembly (ported from lib/ai/context) ────────────────────── */
  function renderContext(search, artifacts) {
    const p = search;
    const facts = [

      .filter(Boolean)
      .join("\n");

    const sections = [`## Search project\n${facts}`];

    /* The canonical IR is the source of truth once it exists (the W8.5
       correction): agents consume it instead of re-deriving requirements
       from the job description, which is then reference material only. */
    const intent =
      (artifacts.intent && artifacts.intent.payload) ||
      (artifacts.hiring_need && artifacts.hiring_need.payload);
    if (intent) {
      sections.push(
        `## Canonical hiring intelligence (IR) — SOURCE OF TRUTH
This is the search's single canonical interpretation. Consume these objects as-is: do NOT re-derive requirements from the job description below, which is reference material only. Treat open uncertainties as unknowns, never as facts; a requirement's verbatim statement and its definition are both binding.
${clip(
  JSON.stringify(
    {
      need: intent.need,
      requirements: intent.requirements,
      uncertainties: intent.uncertainties,
      contradictions: intent.contradictions,
      statements: intent.statements || [],
    },
    null,
    1,
  ),
  14000,
)}`,
      );
    }
    if (p.jd)
      sections.push(`## Job description (verbatim)\n${clip(p.jd, 6000)}`);
    const art = (key, title, budget) => {
      const rec = artifacts[key];
      if (rec && rec.payload)
        sections.push(
          `## ${title}\n${clip(JSON.stringify(rec.payload, null, 1), budget)}`,
        );
    };
    if (!intent) {
      art("role_intelligence", "Role intelligence (recruiter-reviewed)", 6000);
      const intake = artifacts.intake && artifacts.intake.payload;
      if (intake) {
        const answered = [];
        for (const cat of intake.categories || [])
          for (const q of cat.questions || [])
            if (q.answer && q.answer.trim())
              answered.push(`Q (${cat.title}): ${q.question}\nA: ${q.answer}`);
        if (answered.length)
          sections.push(
            `## Hiring-manager intake answers\n${clip(answered.join("\n\n"), 6000)}`,

      }
    }

  /* ── W12 reasoning rules, shared by both canonical-IR tasks ───────────
     Ten defect classes found by the 53-conversation adversarial corpus
     (eval/w12/REPORT.md §12.1, §15, §16). Stated once and carried by both
     the JD derivation and the intake reasoner, because five of the failures
     were at the derivation step, which originally had none of them. */
  const IR_RULES = `Requirement shape (mandatory):
- Each requirement carries: label, statement (verbatim source phrase), definition (what it concretely means for THIS search), kind (must_have | preferred | trainable | disqualifier), origin (jd | manager_statement | research | recruiter | model_inference), evidenceSpec (observable public evidence that would satisfy it), falseSignals (lookalikes that do not), status (explicit | needs_clarification | assumed).
- ONE REQUIREMENT, ONE SOURCE PHRASE. "statement" is the fragment that asserts THIS requirement, quoted exactly — not the whole sentence when it covers several, and never the entire answer. Join split fragments with an ellipsis. Two requirements must never carry the same statement: pasting a whole turn onto each destroys the provenance the field exists for.
- FALSE SIGNALS ARE NOT OPTIONAL. A false signal is the only thing that stops a proxy being read as evidence, and its absence is invisible — nothing downstream can tell "none exist" from "nobody wrote them down". For every must_have and every disqualifier, ask what a candidate could show that LOOKS like this and is not it. Empty because none genuinely exist is fine; empty because the work was skipped is a defect.
- PROXIES BY NAME. A prestige, brand or credential proxy — a named employer, a university, a ranking, an award, a certification usually earned after the work — is never a bare requirement. Name the CONSTRUCT it stands for in "definition", and put the proxy itself in "falseSignals" BY NAME: "TSMC on a profile used in place of the module experience", not "a company name used as a stand-in". A screener can act on the name and cannot act on the abstraction. Both directions belong there: the proxy present, read as evidence, and the proxy absent, read as a reason to deprioritise.
- STATUS IS ABOUT DEFINITION, in two ordered tests. First: could a person be assessed against it, either from observable evidence or by a NAMED assessment step (an interview scenario, a reference call, a practical test)? A disposition with neither — "strong integrity", "comfortable at height", "calm under pressure" — is "needs_clarification" until someone says how it will be judged, and becomes "explicit" the moment they do. Stating a trait is not defining it. Second: if it is assessable, an open THRESHOLD ("how many years of ECMO") keeps it "explicit" with the threshold in a linked uncertainty, while an open DEFINITION — one whose answer changes which population qualifies — does not.
- Something the hiring manager says can be taught or learned on the job is kind "trainable". That is what the kind is for, and it is the only thing that stops the item being screened on.

Uncertainties:
- "consequential" means the answer would change WHO you approach or WHETHER they could accept: the population, the geography, the reachable supply, or a material term — pay, relocation support, shift, start date, work authorisation. A question that only sharpens how you word a screen is worth asking and is NOT consequential; nor is a process question like who signs off. Be honest in both directions: over-flagging turns the ranking into noise, under-flagging hides the questions that decide whether the search is reachable at all.
- An uncertainty about how something here COMPARES with the market outside — the rate against the region, the package against what this population is paid, whether the qualifying population exists locally — cannot be resolved by anyone inside the company. The hiring manager stating their own number answers one side and leaves the other unknown; record their figure and keep it OPEN. Only market evidence closes these.

Contradictions:
- Record both sides with provenance and never silently pick a winner.
- A hiring manager's own example that refutes their own stated rule IS a contradiction. "Nobody without a PhD… well, my best engineer doesn't have one." Amending the requirement to fit the example is usually right in substance, but doing it QUIETLY hides the thing the recruiter has to take back into the room. Record the contradiction and amend.`;

  /* ── AI task registry (prompts ported from lib/ai/tasks) ──────────────── */
  function shapeCheck(payload, spec) {
    for (const [field, kind] of Object.entries(spec)) {
      const v = payload && payload[field];
      if (kind === "array" && !Array.isArray(v))
        return `missing array field "${field}"`;
      if (kind === "string" && typeof v !== "string")
        return `missing string field "${field}"`;
      if (kind === "object" && (typeof v !== "object" || v === null))
        return `missing object field "${field}"`;
    }
    return null;
  }

      shape: `{"difficulty": {"rating": number, "rationale": string}, "sections": [{"title": string, "claims": [{"text": string, "certainty": "estimated"|"inferred"|"unknown", "note": string?}]}], "assumptions": string[], "missingInformation": string[]}`,
      check: (p) =>
        shapeCheck(p, {
          difficulty: "object",
          sections: "array",
          assumptions: "array",
        }),
      render: renderMarket,
    },
    sourcing_strategy: {
      label: "Strategy",
      desc: "The search strategy brief: primary phenotype, viable variants, adjacent populations, titles to chase and noise to cut.",
      persona: "an elite sourcer writing a search strategy brief",
      rules: `Produce the search strategy brief for THIS search:
- primaryTargetProfile: one tight paragraph describing the phenotype most likely to succeed and be closeable.
- secondaryTargetProfiles: distinct, viable variants (not weaker copies of the primary).
- adjacentPossibilities: non-obvious populations with a rationale for why they transfer.
- targetTitles / excludedTitles: the titles to chase and the noise to cut.
- targetCompanies / feederCompanies: name companies only when the context or well-known industry structure supports them; otherwise describe the company type.
- rationale: why this strategy fits this market and this company's pull.
- risks: where this strategy fails and what would signal that early.`,
      ask: "Write the sourcing strategy brief for this search now.",
      shape: `{"primaryTargetProfile": string, "secondaryTargetProfiles": string[], "adjacentPossibilities": [{"text": string, "rationale": string}], "targetTitles": string[], "excludedTitles": string[], "targetCompanies": string[], "feederCompanies": string[], "targetIndustries": string[], "targetGeographies": string[], "rationale": string, "risks": string[]}`,
      check: (p) =>
        shapeCheck(p, {
          primaryTargetProfile: "string",
          targetTitles: "array",
          risks: "array",
        }),
      render: renderStrategy,
    },
    channels: {
      label: "Channels",
      desc: "Where these candidates actually exist, ranked for this search — named venues are marked inferred until you verify them.",
      persona: "a sourcing-channel researcher",
      rules: `Determine WHERE candidates for this specific profession actually exist and rank the channels for THIS search: registries, communities, publications, conferences, associations, universities, portfolios, open-source, directories, job boards, alumni networks, referral sources, events, social networks, databases.
- priority: "high" (work it first), "medium", "experimental" — whyRelevant explains the ranking for THIS search.
- NEVER invent venues. You have no live web access, so mark named external venues certainty "inferred" at best; something you cannot name confidently becomes a channel type description with certainty "unknown". certainty is never "verified".
- Only include a url when highly confident of the canonical domain; otherwise omit it.
- costModel: "free", "paid", or "unknown" — never guess "free".
- reasoningSummary: 3–5 sentences on the overall channel logic.`,
      ask: "Produce the ranked channel map for this search now.",
      shape: `{"channels": [{"name": string, "kind": string, "url": string?, "whyRelevant": string, "priority": "high"|"medium"|"experimental", "costModel": "free"|"paid"|"unknown", "certainty": "estimated"|"inferred"|"unknown"}], "reasoningSummary": string}`,
      check: (p) =>
        shapeCheck(p, { channels: "array", reasoningSummary: "string" }),
      render: renderChannels,
    },
    search_strings: {
      label: "Search Strings",
      desc: "AI expands the vocabulary; a deterministic composer builds the boolean/x-ray matrix. Every query visible, editable, copyable.",
      persona: "an expert boolean/x-ray sourcer",
      rules: `Expand this search's vocabulary for query composition:
- titles: the 2–4 sharpest titles for the primary phenotype.
- alternateTitles: real-world title variants (what these people actually put on profiles).
- adjacentTitles: adjacent-population titles worth an exploratory pass.
- mustHave: 1–3 terms that nearly always appear in a matching profile (each is ANDed — too many kills recall).
- anyOf: OR-group of discriminating skills/venues/tools/keywords for this profession.
- credentials: license/certification tokens when the profession has them — empty otherwise.
- locations: geography tokens incl. common variants.
- companies: target-company tokens only if the strategy names them.
- exclusions: noise to negate ("recruiter", "job", "hiring", vendor spam terms appropriate to this population).
- relevantPlatforms: which of ["research","engineering","design"] platform families fit THIS population (empty array if none beyond general web/LinkedIn).
- extraQueries: platform-specific ready-to-run queries the generic matrix can't express — only real platforms, no invented sites.
All terms must be real search tokens (short, quotable), not sentences.`,
      ask: "Produce the query-expansion vocabulary and platform-specific extra queries for this search now.",
      shape: `{"titles": string[], "alternateTitles": string[], "adjacentTitles": string[], "mustHave": string[], "anyOf": string[], "credentials": string[], "locations": string[], "companies": string[], "exclusions": string[], "relevantPlatforms": string[], "extraQueries": [{"platform": string, "query": string, "purpose": string, "breadth": "narrow"|"balanced"|"broad"|"adjacent"|"experimental"}]}`,
      check: (p) =>
        shapeCheck(p, {
          titles: "array",
          anyOf: "array",
          locations: "array",
          exclusions: "array",
        }),
      render: renderStrings,
    },
  };
  const MODULE_ORDER = [
    "overview",
    "hiring_need",
    "intake_loop",
    "role_intelligence",
    "intake",
    "success_profile",
    "market_intelligence",
    "sourcing_strategy",
    "channels",
    "search_strings",
    "candidates",
    "golden_test",
  ];

  /* ── Sample plumbing ──────────────────────────────────────────────────── */
  let sampleApi = null; // resolved sample fn or null
  /* Generation quality knob: "complex" = most capable tier (slower; the
     platform substitutes a nearby tier if the plan lacks it). */
  const MODEL_TIER = "complex";
  let aiHidden = false; // set true on not_granted / sampling_disabled

  const ERROR_COPY = {
    not_granted:
      "Claude access wasn't allowed for this page, so AI generation is off. Everything else still works.",
    sampling_disabled:
      "Claude isn't available on this account, so AI generation is off.",
    rate_limited:
      "Claude is rate-limited right now — wait a little and try again.",
    refused:
      "Claude declined this request. Edit the inputs and try a different framing.",
    invalid_json:
      "The reply wasn't valid JSON. Try again — if it keeps failing, trim the JD or notes.",
    prompt_too_large:
      "The assembled context is too large. Trim the JD or recruiter notes and retry.",
    empty_completion:
      "Claude produced no output. Try again with slightly different inputs.",
    cancelled: "Stopped.",
    upstream_error: "A transient error interrupted the call. Try again.",
  };
  const copyFor = (code) => ERROR_COPY[code] || ERROR_COPY.upstream_error;

  async function runTask(taskKey, extraContext, ui, opts) {
    const task = TASKS[taskKey];
    const prompt = `${systemPrelude(task.persona)}

${task.rules}

${extraContext}

## Task
${task.ask}

## Output format
Reply with ONLY one JSON object (no markdown fences, no commentary) of this shape:
${task.shape}`;
    const ctl = new AbortController();
    if (ui && ui.bindStop) ui.bindStop(ctl);
    const payload = await sampleApi.json(prompt, {
      signal: ctl.signal,
      cache: opts && opts.regenerate ? false : true,
      onText: ui && ui.onText,
      modelTier: MODEL_TIER,
    });
    const err = task.check(payload);
    if (err) {
      const e = {
        code: "invalid_json",
        message: "shape: " + err,
        text: JSON.stringify(payload),
      };
      throw e;
    }
    const downgrades = downgradeVerified(payload);
    return {
      payload,
      meta: {
        provider: "claude-artifact",
        generatedAt: new Date().toISOString(),
        downgrades,
      },
      traitWarnings: scanForProtectedTraits(payload),
    };
  }

  /* ── Adaptive intake reasoner (ported from lib/ai/tasks/intake-reason) ──
     One turn of the loop: a hiring-manager statement in, an updated canonical
     IR and the next highest-information question out. This is the piece the
     Lite artifact never had — its old intake produced a question list, which
     cannot record what the manager answered. */

  const INTAKE_REASONER_RULES = `You are one turn of the intake loop over the canonical hiring intelligence.

When a new hiring-manager statement is provided:
- extractedClaims: the discrete claims it contains, provenance "manager_statement". Quote closely; never paraphrase meaning away.
- Update the requirement set: clarify definitions the statement resolves, add requirements it introduces, re-classify kinds it corrects.
- UPDATE the existing requirement a statement is about; never add a second one alongside it saying the same thing in the manager's words. One concept, one requirement.
- PROVENANCE MOVES TOGETHER. A requirement's "statement" is verbatim to its source and "origin" names that source. When the manager restates a job-description requirement in their own words, the statement becomes THEIR words, the origin becomes "manager_statement", and assertedBy becomes their speaker. Do not overwrite the statement while leaving origin "jd" — that leaves the provenance lying in both directions. If they only clarify what a JD phrase means, keep the JD statement verbatim and put their words in the definition.
- WITHDRAWN REQUIREMENTS LEAVE THE SET. When a manager takes a requirement away — "drop native", "BSEE, no, take it off", "detail-oriented is filler" — REMOVE it entirely. Do not keep it as "preferred" and never append "(withdrawn)" to its label: "preferred" legitimately raises a candidate's review priority, so a withdrawn requirement kept that way still shapes the search. Nothing is lost — the withdrawal is in extractedClaims and in the verbatim statement log.
- Update uncertainties: resolve the ones the statement answers, open new ones it raises. Do not open a second uncertainty about a question already open — extend the existing one.
- assertedBy: the speaker of the statement the requirement came from. Set it whenever origin is "manager_statement". With several stakeholders this is the only structured record of who wants what.
- contested: true when stakeholders disagree about a requirement and have not reconciled. Never encode disagreement as "needs_clarification", and never weaken or drop a requirement because a later speaker disagrees — both positions stand until the people reconcile them.
- When a stakeholder defines a term, resolve the uncertainty on their word. If ANOTHER stakeholder disputes it, re-open it, mark the requirement contested, and keep it open until they agree.
- FALSE SIGNALS IN THEIR WORDS. When the manager draws a contrast — "not people who've seen the machine", "not that they've had CFO on a call" — put THEIR wording in falseSignals, not a paraphrase. The contrast is the most screenable thing they said.
- CONSTRUCTS IN THEIR WORDS. When they define a term, their own defining words go in the definition. A definition that paraphrases the construct away leaves every downstream agent guessing at exactly the thing that was just settled.

${IR_RULES}

Always:
- nextQuestion: the single question with the highest information value — the one whose answer would most change sourcing or screening. Target open CONSEQUENTIAL uncertainties first and explain the information value honestly. Return null only when nothing consequential remains open.
- Never invent hiring-manager positions; unresolved stays unresolved.
- Return the FULL updated requirement, uncertainty and contradiction sets — they replace the previous ones. Preserve existing ids.`;

  const INTAKE_REASONER_SHAPE = `{"extractedClaims": [{"text": string, "provenance": "manager_statement"}], "requirements": [{"label": string, "statement": string, "definition": string, "kind": "must_have"|"preferred"|"trainable"|"disqualifier", "origin": "jd"|"manager_statement"|"research"|"recruiter"|"model_inference", "assertedBy": string?, "contested": boolean?, "evidenceSpec": string[], "falseSignals": string[], "status": "explicit"|"needs_clarification"|"assumed", "linkedUncertaintyIds": string[]}], "uncertainties": [{"id": string, "about": string, "kind": "ambiguity"|"missing_information"|"conflicting_information"|"assumption", "consequence": string, "consequential": boolean, "status": "open"|"resolved", "resolution": string?}], "contradictions": [{"claimA": {"text": string, "provenance": string}, "claimB": {"text": string, "provenance": string}, "note": string, "status": "open"|"resolved", "resolution": string?}], "nextQuestion": {"question": string, "whyItMatters": string, "targetsUncertaintyIds": string[], "informationValue": string} | null}`;

  /* The evolving canonical intent: the derived IR plus every statement the
     recruiter has recorded, in order. Stored as its own artifact so the
     statement log survives a re-derivation. */
  function currentIntent() {
    const stored = state.artifacts.intent && state.artifacts.intent.payload;
    if (stored) return stored;
    const derived =
      state.artifacts.hiring_need && state.artifacts.hiring_need.payload;
    if (!derived) return null;
    return {
      need: derived.need,
      requirements: derived.requirements || [],
      uncertainties: derived.uncertainties || [],
      contradictions: derived.contradictions || [],
      statements: [],
      revision: 0,
    };
  }

  async function reasonOverStatement(statement, ui) {
    const intent = currentIntent();
    if (!intent) throw { code: "upstream_error", message: "no canonical IR" };
    const prior = intent.statements || [];
    const prompt = `${systemPrelude("an elite recruiter running an adaptive hiring-manager intake")}

${INTAKE_REASONER_RULES}

${renderContext(state.current, state.artifacts)}
## Current canonical intelligence
${clip(
  JSON.stringify(
    {
      need: intent.need,
      requirements: intent.requirements,
      uncertainties: intent.uncertainties,
      contradictions: intent.contradictions,
      priorStatements: prior,
    },
    null,
    1,
  ),
  14000,
)}
## New hiring-manager statement
${JSON.stringify(statement, null, 1)}

## Task
Run one turn of the intake loop now.

## Output format
Reply with ONLY one JSON object (no markdown fences, no commentary) of this shape:
${INTAKE_REASONER_SHAPE}`;

    const ctl = new AbortController();
    if (ui && ui.bindStop) ui.bindStop(ctl);
    const out = await sampleApi.json(prompt, {
      signal: ctl.signal,
      cache: false,
      onText: ui && ui.onText,
      modelTier: MODEL_TIER,
    });
    const err = shapeCheck(out, {
      extractedClaims: "array",
      requirements: "array",
      uncertainties: "array",
      contradictions: "array",
    });
    if (err) throw { code: "invalid_json", message: "shape: " + err };
    downgradeVerified(out);

    // The deterministic backstops run on every turn, behind the rules above.
    const statements = [...prior, statement];
    const hygienic = applyIntakeHygiene(
      out,
      intent.uncertainties,
      state.current.jd,
      statements,
    );
    const next = {
      need: {
        ...intent.need,
        claims: [...(intent.need.claims || []), ...(out.extractedClaims || [])],
      },
      requirements: hygienic.requirements,
      uncertainties: hygienic.uncertainties,
      contradictions: out.contradictions || [],
      statements: statements.map((st) =>
        st === statement ? { ...st, reasonedAt: new Date().toISOString() } : st,
      ),
      revision: (intent.revision || 0) + 1,
      nextQuestion: out.nextQuestion || null,
    };
    return {
      payload: next,
      meta: {
        provider: "claude-artifact",
        generatedAt: new Date().toISOString(),
      },
      traitWarnings: scanForProtectedTraits({
        requirements: next.requirements,
        uncertainties: next.uncertainties,
      }),
    };
  }

  /* ── W10: virtual crew — critic pass + full-search crew runner ────────── */

  async function runCritic(taskLabel, artifactJson, ui) {
    const prompt = `${systemPrelude("an elite recruiting-deliverables reviewer (the crew's critic)")}

Review ONE generated artifact against the bar "would an elite recruiter run this search off this document?":
- Is it specific to THIS role, company, seniority, geography, and market — or generic recruiting boilerplate?
- Does it contradict the JD, the hiring-manager intake answers, or earlier artifacts?
- Are requirements/claims honestly labeled (provenance, certainty) with no invented facts, venues, or people?
- Is anything load-bearing missing that this artifact type must carry?
- Flag any protected-characteristic reference as a blocking issue.
Verdict rules: "accept" when genuinely usable as-is (minor notes go in strengths); "revise" only for concrete, fixable defects a generator can resolve in one pass — 3–6 actionable issues max.

${renderContext(state.current, state.artifacts)}

## Artifact under review: ${taskLabel}
${clip(artifactJson, 8000)}

## Output format
Reply with ONLY one JSON object: {"verdict": "accept"|"revise", "strengths": string[], "issues": string[]}`;
    const ctl = new AbortController();
    if (ui && ui.bindStop) ui.bindStop(ctl);
    const critique = await sampleApi.json(prompt, {
      signal: ctl.signal,
      cache: false,
      modelTier: MODEL_TIER,
    });
    if (critique.verdict !== "accept" && critique.verdict !== "revise")
      throw { code: "invalid_json", message: "bad critic verdict" };
    critique.strengths = Array.isArray(critique.strengths)
      ? critique.strengths
      : [];
    critique.issues = Array.isArray(critique.issues) ? critique.issues : [];
    return critique;
  }

  /* Generate one module with the crew treatment: generate → critic →
   (one revision pass with the critique in context). */
  async function generateWithCritic(key, ui) {
    const task = TASKS[key];
    const regenerate = Boolean(state.artifacts[key]);
    let result = await runTask(
      key,
      renderContext(state.current, state.artifacts),
      ui,
      { regenerate },
    );
    state.artifacts[key] = result;
    await store.saveArtifact(state.current.id, key, result);

    if (ui.step) ui.step(`critic reviewing ${task.label.toLowerCase()}`);
    const critique = await runCritic(
      task.label,
      JSON.stringify(result.payload),
      ui,
    );
    result.critique = critique;
    if (critique.verdict === "revise" && critique.issues.length > 0) {
      if (ui.step)
        ui.step(
          `revising ${task.label.toLowerCase()} (${critique.issues.length} findings)`,
        );
      const revisionContext =
        renderContext(state.current, state.artifacts) +
        `\n## Critic findings to address (this is a REVISION pass)\nA reviewer flagged the previous draft. Produce a full corrected artifact that resolves every finding:\n` +
        critique.issues.map((issue) => `- ${issue}`).join("\n");
      result = await runTask(key, revisionContext, ui, { regenerate: true });
      result.critique = { ...critique, revised: true };
    }
    state.artifacts[key] = result;
    await store.saveArtifact(state.current.id, key, result);
    return result;
  }

  const CREW_ORDER = [
    "role_intelligence",
    "intake",
    "success_profile",
    "market_intelligence",
    "sourcing_strategy",
    "channels",
    "search_strings",
  ];

  /* The full-search virtual crew: every module in dependency order, each
   with a critic pass. Intake answers stay the human's job — the crew
   generates the questions and moves on. */
  async function runCrewForSearch(ui) {
    for (const key of CREW_ORDER) {
      ui.step(`${TASKS[key].label} agent`);
      await generateWithCritic(key, ui);
    }
  }

  async function runCandidateAgents(cand, ui) {
    ui.step("evidence agent");
    cand.evidence = await runCandidateTask("evidence", cand, ui);
    await store.saveCandidate(state.current.id, cand);
    ui.step("outreach agent");
    cand.outreach = await runCandidateTask("outreach", cand, ui);
    await store.saveCandidate(state.current.id, cand);
  }

  /* ── App state ────────────────────────────────────────────────────────── */
  const state = {
    searches: [],
    current: null,
    artifacts: {},
    candidates: [],
    module: "overview",
    storageMode: "local",
  };

  async function selectSearch(id) {
    state.current = state.searches.find((s) => s.id === id) || null;
    state.artifacts = state.current ? await store.loadArtifacts(id) : {};
    state.candidates = state.current ? await store.listCandidates(id) : [];
    state.module = "overview";
    render();
  }

  /* ── Rendering: shell ─────────────────────────────────────────────────── */
  function render() {
    renderRail();
    renderMain();
  }

  function renderRail() {
    const list = $("#search-list");
    list.innerHTML = "";
    for (const s of state.searches) {
      const active = state.current && state.current.id === s.id;
      const item = el(`<button class="search-item ${active ? "active" : ""}">
      <div class="si-name">${esc(s.roleTitle)} ${s.example ? '<span class="chip example">example</span>' : ""}</div>
      <div class="si-sub">${esc(s.companyName || "")} · ${esc(s.geography || "")}</div>
    </button>`);
      item.onclick = () => selectSearch(s.id);
      list.append(item);
    }
    const nav = $("#mod-nav");
    nav.innerHTML = "";
    if (!state.current) return;
    for (const key of MODULE_ORDER) {
      const label =
        key === "overview"
          ? "Overview"
          : key === "intake_loop"
            ? "Intake loop"
            : key === "candidates"
              ? "Candidates"
              : key === "golden_test"
                ? "Golden Test"
                : TASKS[key].label;
      const done =
        key === "overview"
          ? true
          : key === "intake_loop"
            ? Boolean(
                state.artifacts.intent &&
                (state.artifacts.intent.payload.statements || []).length,
              )
            : key === "candidates"
              ? state.candidates.length > 0
              : Boolean(state.artifacts[key]);
      const item = el(
        `<button class="mod-item ${state.module === key ? "active" : ""}"><span class="dot ${done ? "done" : ""}"></span>${esc(label)}</button>`,
      );
      item.onclick = () => {
        state.module = key;
        render();
      };
      nav.append(item);
    }
    $("#rail-foot").textContent =
      state.storageMode === "db"
        ? "Saved to this artifact's private store. Nothing sends automatically."
        : "Saved in this browser only (offline mode). Nothing sends automatically.";
  }

  function renderMain() {
    const main = $("#main");
    main.innerHTML = "";
    if (!state.current) {
      main.append(renderNewSearchForm(true));
      return;
    }
    if (state.module === "overview") return renderOverview(main);
    if (state.module === "intake_loop") return renderIntakeLoop(main);
    if (state.module === "candidates") return renderCandidates(main);
    if (state.module === "golden_test") return renderGolden(main);
    renderTaskModule(main, state.module);
  }

  /* ── Module frame with generate / regenerate / edit JSON ──────────────── */
  function renderTaskModule(main, key) {
    const task = TASKS[key];
    const rec = state.artifacts[key];
    main.append(
      el(`<div class="mod-head"><h2>${esc(task.label)}</h2>
    ${rec ? '<span class="chip inference">model inference</span>' : ""}
    <span class="spacer"></span></div>`),
    );
    main.append(el(`<p class="mod-desc">${esc(task.desc)}</p>`));

    const head = $(".mod-head", main);
    const body = el(`<div></div>`);
    main.append(body);

    if (aiHidden)
      main.append(
        el(`<div class="notice warning">${esc(copyFor("not_granted"))}</div>`),
      );

    const genBtn = el(
      `<button class="btn ${rec ? "" : "primary"}">${rec ? "Regenerate" : "Generate"}</button>`,
    );
    const stopBtn = el(`<button class="btn small" hidden>Stop</button>`);
    if (!aiHidden && sampleApi) {
      head.append(genBtn, stopBtn);
    }

    let ctl = null;
    stopBtn.onclick = () => ctl && ctl.abort();

    genBtn.onclick = async () => {
      genBtn.disabled = true;
      stopBtn.hidden = false;
      body.innerHTML = "";
      const think = el(
        `<div class="panel"><div class="thinking">Generating ${esc(task.label.toLowerCase())} — Claude is thinking…</div><div class="stream"></div></div>`,
      );
      body.append(think);
      const streamEl = $(".stream", think);
      try {
        const result = await runTask(
          key,
          renderContext(state.current, state.artifacts),
          {
            bindStop: (c) => {
              ctl = c;
            },
            onText: ({ text }) => {
              streamEl.textContent = text.slice(-1500);
              streamEl.scrollTop = streamEl.scrollHeight;
            },
          },
          { regenerate: Boolean(rec) },
        );
        state.artifacts[key] = result;
        await store.saveArtifact(state.current.id, key, result);
        render();
      } catch (e) {
        if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) {
          aiHidden = true;
        }
        body.innerHTML = "";
        body.append(
          el(
            `<div class="notice error"><strong>Generation failed.</strong> ${esc(copyFor(e && e.code))}</div>`,
          ),
        );
        if (rec) paintArtifact(body, key, rec);
        genBtn.disabled = false;
        stopBtn.hidden = true;
      }
    };

    if (rec) paintArtifact(body, key, rec);
    else
      body.append(
        el(
          `<div class="panel"><p class="why">Not generated yet. ${aiHidden || !sampleApi ? "AI generation is unavailable in this view." : "Generation runs on your Claude account — the first call asks for permission."}</p></div>`,
        ),
      );
  }

  function paintArtifact(body, key, rec) {
    if (rec.traitWarnings && rec.traitWarnings.length) {
      body.append(
        el(
          `<div class="notice warning"><strong>Review required:</strong> the output mentions ${esc(rec.traitWarnings.join(", "))}. Protected characteristics must never drive evaluation — edit before use.</div>`,
        ),
      );
    }
    if (rec.critique) {
      const verdictGood = rec.critique.verdict === "accept";
      body.append(
        el(
          `<div class="notice" style="border-left-color:${verdictGood ? "var(--ok)" : "var(--warn)"}"><strong>Critic: ${verdictGood ? "accept" : "revise"}${rec.critique.revised ? " → revised once" : ""}.</strong>${(rec.critique.issues || []).length ? `<ul style="margin:6px 0 0;padding-left:18px">${rec.critique.issues.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}</div>`,
        ),
      );
    }
    const rendered = el(`<div></div>`);
    try {
      TASKS[key].render(rendered, rec.payload);
    } catch (e) {
      rendered.append(
        el(
          `<div class="notice error">Render failed (${esc(String(e && e.message))}) — use Edit JSON below.</div>`,
        ),
      );
    }
    body.append(rendered);

    const editWrap = el(
      `<div class="panel"><h4 style="margin-top:0">Edit JSON <span class="why">— the draft is yours; edits are saved verbatim</span></h4></div>`,
    );
    const ta = el(`<textarea class="mono" rows="10"></textarea>`);
    ta.value = JSON.stringify(rec.payload, null, 2);
    const saveBtn = el(
      `<button class="btn small" style="margin-top:8px">Save edits</button>`,
    );
    const msg = el(`<span class="why" style="margin-left:10px"></span>`);
    saveBtn.onclick = async () => {
      try {
        const payload = JSON.parse(ta.value);
        const err = TASKS[key].check(payload);
        if (err) {
          msg.textContent = "Not saved — " + err;
          return;
        }
        downgradeVerified(payload);
        rec.payload = payload;
        rec.meta = {
          ...(rec.meta || {}),
          editedAt: new Date().toISOString(),
          editedBy: "recruiter",
        };
        rec.traitWarnings = scanForProtectedTraits(payload);
        await store.saveArtifact(state.current.id, key, rec);
        render();
      } catch {
        msg.textContent = "Not saved — invalid JSON.";
      }
    };
    editWrap.append(ta, saveBtn, msg);
    body.append(editWrap);
    if (rec.meta)
      body.append(
        el(
          `<p class="why num">Generated ${esc(rec.meta.generatedAt || "")}${rec.meta.editedAt ? ` · edited ${esc(rec.meta.editedAt)}` : ""} · provider: ${esc(rec.meta.provider || "claude-artifact")}</p>`,
        ),
      );
  }

  /* ── Renderers per artifact ───────────────────────────────────────────── */
  const chipFor = (v) => {
    const cls =
      {
        strong: "ok",
        partial: "warn",
        missing: "bad",
        contradictory: "bad",
        unknown: "unknown",
        estimated: "warn",
        inferred: "unknown",
        high: "ok",
        medium: "warn",
        experimental: "unknown",
      }[v] || "unknown";
    return `<span class="chip ${cls}">${esc(v)}</span>`;
  };
  const provChip = (p) =>
    `<span class="chip ${p === "model_inference" ? "inference" : ""}">${esc((p || "").replace("_", " "))}</span>`;
  const tracedList = (items) =>
    `<ul>${(items || []).map((i) => `<li>${esc(i.text)} ${provChip(i.provenance)}${i.note ? ` <span class="why">${esc(i.note)}</span>` : ""}</li>`).join("")}</ul>`;
  const plainList = (items) =>
    `<ul>${(items || []).map((i) => `<li>${esc(typeof i === "string" ? i : i.text)}</li>`).join("")}</ul>`;

  /* ── Canonical IR renderers ───────────────────────────────────────────── */

  function requirementCard(r) {
    const chips = [
      `<span class="chip ${r.kind === "must_have" ? "warn" : "num"}">${esc(r.kind)}</span>`,
      `<span class="chip ${r.status === "explicit" ? "num" : "warn"}">${esc(r.status)}</span>`,
      `<span class="chip inference">${esc(r.origin)}</span>`,
      r.assertedBy
        ? `<span class="chip num">asserted by ${esc(r.assertedBy)}</span>`
        : "",
      r.contested ? `<span class="chip warn">contested</span>` : "",
    ]
      .filter(Boolean)
      .join(" ");
    const list = (title, items, why) =>
      (items || []).length
        ? `<h4>${title} <span class="why">${why}</span></h4>${plainList(items)}`
        : `<h4>${title}</h4><p class="why">None recorded.${
            title === "False signals"
              ? " A false signal is the only thing that stops a proxy being read as evidence — if one exists, it belongs here."
              : ""
          }</p>`;
    return `<div style="margin:14px 0;padding-top:12px;border-top:1px solid var(--line-soft)">
      <div class="qq">${esc(r.label)}</div>
      <div style="margin:4px 0 8px">${chips}</div>
      <p>${esc(r.definition || "")}</p>
      <p class="why">Source phrase: “${esc(r.statement || "")}”</p>
      ${list("Evidence", r.evidenceSpec, "— observable proof a sourcer can find")}
      ${list("False signals", r.falseSignals, "— lookalikes that are not evidence")}
    </div>`;
  }

  function renderChannels(root, p) {
    root.append(
      el(
        `<div class="panel"><p class="why">${esc(p.reasoningSummary || "")}</p></div>`,
      ),
    );
    const order = { high: 0, medium: 1, experimental: 2 };
    const channels = [...(p.channels || [])].sort(
      (a, b) => (order[a.priority] ?? 3) - (order[b.priority] ?? 3),
    );
    const panel = el(`<div class="panel"></div>`);
    for (const c of channels) {
      panel.append(
        el(`<div class="qrow"><div class="qmeta"><div class="plat">${esc(c.name)}</div>${chipFor(c.priority)} ${chipFor(c.certainty)} <span class="chip">${esc(c.costModel)}</span></div>
      <div style="flex:1"><div>${esc(c.whyRelevant)}</div>${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a> <span class="why">(unverified)</span>` : ""}</div></div>`),
      );
    }
    root.append(panel);
  }

  function renderStrings(root, p) {
    const input = {
      titles: p.titles || [],
      alternateTitles: p.alternateTitles || [],
      adjacentTitles: p.adjacentTitles || [],
      mustHave: p.mustHave || [],
      anyOf: p.anyOf || [],
      credentials: p.credentials || [],
      locations: p.locations || [],
      companies: p.companies || [],
      exclusions: p.exclusions || [],
    };
    const composed = composeQueries(input, [
      "general",
      ...(p.relevantPlatforms || []),
    ]);
    const panel = el(
      `<div class="panel"><h3>Composed matrix <span class="why num">— ${composed.length} deterministic variants, deduped</span></h3></div>`,
    );
    for (const q of composed) {
      const row =
        el(`<div class="qrow"><div class="qmeta"><div class="plat">${esc(q.platform)}</div>${chipFor(q.expectedPrecision)} <span class="chip">${esc(q.breadth)}</span>${q.overBudget ? ' <span class="chip warn">&gt;32 words</span>' : ""}</div>
      <pre class="mono">${esc(q.query)}</pre></div>`);
      const btn = el(`<button class="btn small">Copy</button>`);
      btn.onclick = () => copyText(q.query, btn);
      row.append(btn);
      panel.append(row);
    }
    root.append(panel);
    if ((p.extraQueries || []).length) {
      const extra = el(
        `<div class="panel"><h3>Platform-specific queries <span class="why">— model-suggested, verify the platform before relying on it</span></h3></div>`,
      );
      for (const q of p.extraQueries) {
        const row =
          el(`<div class="qrow"><div class="qmeta"><div class="plat">${esc(q.platform)}</div><span class="chip">${esc(q.breadth || "")}</span><div class="why">${esc(q.purpose || "")}</div></div>
        <pre class="mono">${esc(q.query)}</pre></div>`);
        const btn = el(`<button class="btn small">Copy</button>`);
        btn.onclick = () => copyText(q.query, btn);
        row.append(btn);
        extra.append(row);
      }
      root.append(extra);
    }
    if (composed.some((q) => q.overBudget))
      root.append(
        el(
          `<div class="notice warning">Queries flagged <b>&gt;32 words</b> exceed Google's effective term limit and will silently truncate — trim before running.</div>`,
        ),
      );
  }

  /* ── Overview module ──────────────────────────────────────────────────── */
  function factsForm(s, onSave, isNew) {
    const f = el(`<div class="panel"><div class="form-grid"></div></div>`);
    const grid = $(".form-grid", f);
    const fields = [
      ["name", "Search name"],
      ["companyName", "Company"],
      ["roleTitle", "Role title"],
      ["geography", "Geography"],
      ["country", "Country"],
      ["industry", "Industry"],
      ["seniority", "Seniority"],
      ["employmentType", "Employment type"],
      ["compensationNote", "Compensation note"],
      ["businessObjective", "Business objective"],
    ];
    const inputs = {};
    for (const [key, label] of fields) {
      const w = el(`<label class="field"><b>${esc(label)}</b></label>`);
      const input = el(`<input type="text">`);
      input.value = s[key] || "";
      inputs[key] = input;
      w.append(input);
      grid.append(w);
    }
    const jdW = el(
      `<label class="field" style="grid-column:1/-1"><b>Job description (paste)</b></label>`,
    );
    const jd = el(`<textarea rows="8"></textarea>`);
    jd.value = s.jd || "";
    jdW.append(jd);
    grid.append(jdW);
    const notesW = el(
      `<label class="field" style="grid-column:1/-1"><b>Recruiter notes</b></label>`,
    );
    const notes = el(`<textarea rows="2"></textarea>`);
    notes.value = s.recruiterNotes || "";
    notesW.append(notes);
    grid.append(notesW);
    const save = el(
      `<button class="btn primary">${isNew ? "Create search" : "Save"}</button>`,
    );
    save.onclick = () => {
      for (const [key] of fields) s[key] = inputs[key].value.trim();
      s.jd = jd.value;
      s.recruiterNotes = notes.value.trim();
      if (!s.roleTitle) {
        save.textContent = "Role title is required";
        return;
      }
      if (!s.name) s.name = `${s.companyName || "Search"} — ${s.roleTitle}`;
      onSave(s);
    };
    f.append(save);
    return f;
  }

  function renderNewSearchForm(standalone) {
    const wrap = el(`<div><div class="mod-head"><h2>New search</h2></div>
    <p class="mod-desc">One search = one hiring need. The facts and JD you enter here become the context for every generated module.</p></div>`);
    const s = { id: uid(), createdAt: new Date().toISOString() };
    wrap.append(
      factsForm(
        s,
        async (saved) => {
          await store.saveSearch(saved);
          state.searches.unshift(saved);
          await selectSearch(saved.id);
        },
        true,
      ),
    );
    if (standalone && state.searches.length)
      wrap.append(
        el(
          `<p class="why">…or pick an existing search from the left rail.</p>`,
        ),

  }

  function renderOverview(main) {
    const s = state.current;
    main.append(
      el(
        `<div class="mod-head"><h2>${esc(s.name)}</h2>${s.example ? '<span class="chip example">example data</span>' : ""}</div>`,
      ),
    );
    main.append(
      el(
        `<p class="mod-desc">Everything below is the shared context for generation. Edit facts here; each module then generates from the latest state — role intelligence first, then intake, and onward down the rail.</p>`,
      ),
    );
    if (s.example)
      main.append(
        el(
          `<div class="notice">This is a bundled example search (a public CAIS job description) so the workroom isn't empty on first open. Create your own search from the rail — nothing here is your data.</div>`,
        ),
      );
    main.append(
      factsForm(
        s,
        async (saved) => {
          await store.saveSearch(saved);
          render();
        },
        false,
      ),
    );
    const done = MODULE_ORDER.filter(
      (k) => k !== "overview" && k !== "candidates" && state.artifacts[k],
    ).length;
    if (sampleApi && !aiHidden) {
      const crewPanel = el(`<div class="panel"><h3>Crew</h3>
        <p class="why">Run the full agent crew: each module generated by a role-scoped specialist, reviewed by a critic, and revised once when the critic finds concrete defects (~${CREW_ORDER.length * 2} Claude calls). Intake answers stay yours. Agents draft — you decide.</p></div>`);
      const crewBtn = el(
        `<button class="btn primary">Run crew on this search</button>`,
      );
      const crewStop = el(`<button class="btn small" hidden>Stop</button>`);
      crewPanel.append(crewBtn, crewStop);
      let stopCtl = null;
      crewStop.onclick = () => stopCtl && stopCtl.abort();
      crewBtn.onclick = async () => {
        crewBtn.disabled = true;
        crewStop.hidden = false;
        const progress = el(
          `<div style="margin-top:10px"><ul class="run-log" style="margin:0;padding-left:18px"></ul><div class="stream"></div></div>`,
        );
        crewPanel.append(progress);
        const log = progress.querySelector(".run-log");
        const streamEl = progress.querySelector(".stream");
        try {
          await runCrewForSearch({
            bindStop: (c) => {
              stopCtl = c;
            },
            step: (name) => {
              log.append(el(`<li>${esc(name)}</li>`));
            },
            onText: ({ text }) => {
              streamEl.textContent = text.slice(-1000);
              streamEl.scrollTop = streamEl.scrollHeight;
            },
          });
          render();
        } catch (e) {
          if (e && (e.code === "not_granted" || e.code === "sampling_disabled"))
            aiHidden = true;
          progress.append(
            el(
              `<div class="notice error"><strong>Crew stopped.</strong> ${esc(copyFor(e && e.code))} Finished modules are saved.</div>`,
            ),
          );
          crewBtn.disabled = false;
          crewStop.hidden = true;
        }
      };
      main.append(crewPanel);
    }
    main.append(
      el(`<div class="panel"><h3>Pipeline</h3><p class="num">${done} of ${MODULE_ORDER.length - 2} modules generated · ${state.candidates.length} candidate${state.candidates.length === 1 ? "" : "s"}</p>
    <p class="why">Suggested order: Role Intelligence → HM Intake (answer the questions) → Success Profile → Market Intel → Strategy → Channels → Search Strings → Candidates.</p></div>`),
    );
  }

  /* ── Intake loop module (the adaptive reasoner's surface) ─────────────── */

  function renderIntakeLoop(main) {
    main.append(
      el(
        `<div class="mod-head"><h2>Intake loop</h2><span class="spacer"></span></div>`,
      ),
    );
    main.append(
      el(
        `<p class="mod-desc">Record what the hiring manager actually said. Each statement is reasoned over once: requirements update with their provenance, uncertainties open and close, contradictions are recorded rather than resolved silently, and you get the single question worth asking next.</p>`,
      ),
    );

    const intent = currentIntent();
    if (!intent) {
      main.append(
        el(
          `<div class="panel"><p class="why">Generate the <strong>Canonical IR</strong> first — the loop reasons over it. Nothing here re-reads the job description.</p></div>`,
        ),
      );
      return;
    }

    const body = el(`<div></div>`);
    main.append(body);

    if (intent.nextQuestion) {
      const q = intent.nextQuestion;
      body.append(
        el(`<div class="panel"><h3>Ask this next</h3>
        <p class="qq">${esc(q.question)}</p>
        <p class="why">Why it matters: ${esc(q.whyItMatters || "")}</p>
        <p class="why">Information value: ${esc(q.informationValue || "")}</p></div>`),
      );
    }

    const form =
      el(`<div class="panel"><h3>Record a hiring-manager statement</h3>
      <p class="why">Quote them. The verbatim text is kept as provenance and never rewritten.</p></div>`);
    const speaker = el(

      go.disabled = true;

        el(`<div class="notice warning">${esc(copyFor("not_granted"))}</div>`),
      );
    }

    let ctl = null;
    stop.onclick = () => ctl && ctl.abort();
    go.onclick = async () => {
      const said = text.value.trim();
      if (!said) return;
      go.disabled = true;
      stop.hidden = false;
      const think = el(
        `<div class="panel"><div class="thinking">Reasoning over the statement — Claude is thinking…</div><div class="stream"></div></div>`,
      );
      body.append(think);
      const streamEl = $(".stream", think);
      try {
        const statement = {
          id: uid(),
          at: new Date().toISOString(),
          speaker: speaker.value.trim() || "hiring_manager",
          text: said,
          context: context.value.trim() || undefined,
        };
        const result = await reasonOverStatement(statement, {
          bindStop: (c) => {
            ctl = c;
          },
          onText: ({ text: t }) => {
            streamEl.textContent = t.slice(-1500);
            streamEl.scrollTop = streamEl.scrollHeight;
          },
        });
        state.artifacts.intent = result;
        await store.saveArtifact(state.current.id, "intent", result);
        render();
      } catch (e) {
        if (e && (e.code === "not_granted" || e.code === "sampling_disabled"))
          aiHidden = true;
        think.remove();
        body.append(
          el(
            `<div class="notice error"><strong>Reasoning failed.</strong> ${esc(copyFor(e && e.code))}</div>`,
          ),
        );
        go.disabled = false;
        stop.hidden = true;
      }
    };

    const rec = state.artifacts.intent;
    if (rec && rec.traitWarnings && rec.traitWarnings.length)
      body.append(
        el(
          `<div class="notice warning"><strong>Review required:</strong> the updated intelligence mentions ${esc(rec.traitWarnings.join(", "))}. Protected characteristics must never drive evaluation — edit before use.</div>`,
        ),
      );

    const log = intent.statements || [];
    if (log.length)
      body.append(
        el(
          `<div class="panel"><h3>Statement log <span class="why">— verbatim, in order, revision ${esc(String(intent.revision || 0))}</span></h3>${log
            .map(
              (
                st,
              ) => `<div style="margin:10px 0;padding-top:8px;border-top:1px solid var(--line-soft)">

          ${st.context ? `<p class="why">Asked: ${esc(st.context)}</p>` : ""}
          <p>“${esc(st.text)}”</p></div>`,
            )
            .join("")}</div>`,
        ),
      );

    const ir = el(`<div></div>`);
    body.append(ir);
    renderCanonicalIR(ir, intent);
  }

  function candidateContext(cand) {
    const lines = [
      `Name: ${cand.name}`,
      cand.currentTitle ? `Current title: ${cand.currentTitle}` : "",
      cand.currentCompany ? `Current company: ${cand.currentCompany}` : "",
      cand.geography ? `Geography: ${cand.geography}` : "",
      (cand.profileUrls || []).length
        ? `Profile URLs: ${cand.profileUrls.join(", ")}`
        : "",
      cand.notes ? `Recruiter notes: ${cand.notes}` : "",
      cand.pastedText
        ? `Resume / pasted profile text:\n${clip(cand.pastedText, 6000)}`
        : "",
    ]
      .filter(Boolean)
      .join("\n");
    return `## Candidate\n${lines}`;

  const CANDIDATE_TASKS = {
    evidence: {
      label: "Evidence alignment",
      persona: "a talent researcher performing evidence alignment",
      rules: `This is recruiter decision support, NOT candidate selection. Compare the candidate's observable, job-related professional evidence against the search's success-profile criteria.
For each relevant criterion produce an item:
- status: "strong" (clear supporting evidence in the provided material), "partial", "missing" (criterion matters, no evidence found — absence of evidence, not evidence of absence), "contradictory", "unknown".
- evidenceText: quote or precisely describe the evidence FROM THE PROVIDED MATERIAL ONLY. Never invent facts about this person. For "missing"/"unknown", say what was looked for and not found.
- reviewPriority.suggestion is advisory only ("review_first"|"review"|"review_later") with reasoning; the recruiter decides.`,
      ask: "Produce the evidence alignment for this candidate now.",
      shape: `{"items": [{"criterion": string, "status": "strong"|"partial"|"missing"|"contradictory"|"unknown", "evidenceText": string}], "reviewPriority": {"suggestion": "review_first"|"review"|"review_later", "reasoning": string}, "questionsToValidate": string[]}`,
      check: (p) => shapeCheck(p, { items: "array", reviewPriority: "object" }),
    },
    outreach: {
      label: "Outreach drafts",
      persona: "an elite candidate-engagement writer",
      rules: `Draft a full outreach sequence for this candidate: email_1, follow_up_1, follow_up_2, follow_up_3, breakup, plus linkedin_connect (≤300 chars) and inmail. Nothing sends automatically — these are drafts the recruiter copies out.
Non-negotiables:
- NEVER invent facts about the candidate. Personalize ONLY from the provided evidence items and candidate material. Every personalization gets a citations entry: {personalization, evidence}. If there is no real evidence, write honest, direct outreach without fake familiarity — and say so in cadenceRationale.
- Subject lines: 2–3 variants per email step, none clickbait.
- Voice: direct, specific, peer-to-peer; match the seniority.
- dayOffset per step. Default cadence 0/3/7/12/20 — ADAPT to seniority, scarcity, channel; explain in cadenceRationale.
- No manipulation, no false urgency, no deceptive pressure. Include a respectful opt-out in the breakup step.`,
      ask: "Draft the complete outreach sequence for this candidate now.",
      shape: `{"steps": [{"kind": "email_1"|"follow_up_1"|"follow_up_2"|"follow_up_3"|"breakup"|"linkedin_connect"|"inmail", "dayOffset": number, "subjectVariants": string[], "body": string, "citations": [{"personalization": string, "evidence": string}]}], "cadenceRationale": string}`,
      check: (p) =>
        shapeCheck(p, { steps: "array", cadenceRationale: "string" }),
    },
  };

  async function runCandidateTask(taskKey, cand, ui) {
    const task = CANDIDATE_TASKS[taskKey];
    const evidencePart =
      taskKey === "outreach" && cand.evidence
        ? `\n## Evidence available for personalization\n${clip(JSON.stringify(cand.evidence.payload.items, null, 1), 4000)}`
        : "";
    const prompt = `${systemPrelude(task.persona)}

${task.rules}

${renderContext(state.current, state.artifacts)}

${candidateContext(cand)}${evidencePart}

## Task
${task.ask}

## Output format
Reply with ONLY one JSON object (no markdown fences, no commentary) of this shape:
${task.shape}`;
    const ctl = new AbortController();
    if (ui && ui.bindStop) ui.bindStop(ctl);
    const payload = await sampleApi.json(prompt, {
      signal: ctl.signal,
      cache: false,
      onText: ui && ui.onText,
      modelTier: MODEL_TIER,
    });
    const err = task.check(payload);
    if (err) throw { code: "invalid_json", message: err };
    const downgrades = downgradeVerified(payload);
    return {
      payload,
      meta: {
        provider: "claude-artifact",
        generatedAt: new Date().toISOString(),
        downgrades,
      },
      traitWarnings: scanForProtectedTraits(payload),
    };
  }
