<title>TalentOS</title>
<style>
  /* ── Tokens: dark-first workroom; light is the swapped set ─────────── */
:root {
  --ink: #10151b;
  --surface: #171e26;
  --surface-2: #1d2630;
  --line: #2a3440;
  --line-soft: #222b35;
  --text: #e7ecf1;
  --muted: #8c99a6;
  --faint: #5f6b77;
  --accent: #efa53e;
  --accent-ink: #10151b;
  --accent-soft: rgba(239, 165, 62, 0.12);
  --ok: #5cbe8f;
  --warn: #d9b54a;
  --bad: #d97762;
  --unknown: #7e8b98;
  --chip-ink: #10151b;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "Archivo", system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink: #f5f3ee;
    --surface: #fdfcf9;
    --surface-2: #efece4;
    --line: #d8d2c6;
    --line-soft: #e5e0d6;
    --text: #23292f;
    --muted: #68727c;
    --faint: #98a0a9;
    --accent: #c07d17;
    --accent-ink: #fdfcf9;
    --accent-soft: rgba(192, 125, 23, 0.1);
    --ok: #2e8f63;
    --warn: #9c7c1c;
    --bad: #b6503a;
    --unknown: #6d7883;
    --chip-ink: #fdfcf9;
  }
}
:root[data-theme="light"] {
  --ink: #f5f3ee;
  --surface: #fdfcf9;
  --surface-2: #efece4;
  --line: #d8d2c6;
  --line-soft: #e5e0d6;
  --text: #23292f;
  --muted: #68727c;
  --faint: #98a0a9;
  --accent: #c07d17;
  --accent-ink: #fdfcf9;
  --accent-soft: rgba(192, 125, 23, 0.1);
  --ok: #2e8f63;
  --warn: #9c7c1c;
  --bad: #b6503a;
  --unknown: #6d7883;
  --chip-ink: #fdfcf9;
}

* {
  box-sizing: border-box;
}
html {
  height: 100%;
}
body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font: 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
#app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Rail ──────────────────────────────────────────────────────────── */
.rail {
  width: 252px;
  flex: none;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto;
}
.brand {
  padding: 16px 16px 10px;
  border-bottom: 1px solid var(--line-soft);
}
.brand h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
}
.brand h1 span {
  color: var(--accent);
}
.brand small {
  color: var(--muted);
  font-size: 11px;
  display: block;
  margin-top: 2px;
}
.rail-section {
  padding: 12px 10px 4px;
}
.rail-label {
  font: 600 10px/1 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--faint);
  padding: 0 6px 6px;
}
.search-item {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  color: var(--text);
  font: inherit;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.search-item:hover {
  background: var(--surface-2);
}
.search-item.active {
  background: var(--accent-soft);
}
.search-item .si-name {
  font-weight: 600;
  font-size: 13px;
}
.search-item .si-sub {
  color: var(--muted);
  font-size: 11.5px;
}
.modnav {
  padding: 4px 10px 16px;
}
.mod-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 12.5px;
  padding: 5px 8px;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
}
.mod-item:hover {
  background: var(--surface-2);
  color: var(--text);
}
.mod-item.active {
  color: var(--text);
  background: var(--surface-2);
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: none;
  background: var(--line);
}
.dot.done {
  background: var(--ok);
}
.rail-foot {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid var(--line-soft);
  color: var(--faint);
  font-size: 11px;
}

/* ── Main ──────────────────────────────────────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
}
.main-inner {
  max-width: 880px;
  margin: 0 auto;
  padding: 20px 28px 80px;
}
.mod-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin: 6px 0 4px;
}
.mod-head h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.mod-desc {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 16px;
  max-width: 62ch;
}
.spacer {
  flex: 1;
}

button.btn {
  font: 600 12.5px/1 var(--sans);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
}
button.btn:hover {
  border-color: var(--muted);
}
button.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
button.btn.primary:hover {
  filter: brightness(1.08);
}
button.btn:disabled {
  opacity: 0.5;
  cursor: default;
}
button.btn.small {
  padding: 5px 9px;
  font-size: 11.5px;
}
button:focus-visible,
.search-item:focus-visible,
.mod-item:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  padding: 16px 18px;
  margin: 0 0 14px;
}
.panel h3 {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 700;
}
.panel h4 {
  margin: 14px 0 6px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.panel p {
  margin: 6px 0;
}
.panel ul {
  margin: 6px 0;
  padding-left: 20px;
}
.panel li {
  margin: 4px 0;
}
.kv {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 4px 14px;
  font-size: 13px;
}
.kv dt {
  color: var(--muted);
  margin: 0;
}
.kv dd {
  margin: 0;
}

.chip {
  display: inline-block;
  font: 600 10px/1 var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 4px;
  vertical-align: 1px;
  border: 1px solid var(--line);
  color: var(--muted);
}
.chip.inference {
  border-color: var(--accent);
  color: var(--accent);
}
.chip.ok {
  border-color: var(--ok);
  color: var(--ok);
}
.chip.warn {
  border-color: var(--warn);
  color: var(--warn);
}
.chip.bad {
  border-color: var(--bad);
  color: var(--bad);
}
.chip.unknown {
  border-color: var(--unknown);
  color: var(--unknown);
}
.chip.example {
  border-color: var(--warn);
  color: var(--warn);
}

.notice {
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 0 0 14px;
  font-size: 13px;
  color: var(--muted);
  background: var(--surface);
}
.notice.error {
  border-left-color: var(--bad);
}
.notice.warning {
  border-left-color: var(--warn);
}
.notice strong {
  color: var(--text);
}

textarea,
input[type="text"],
select {
  width: 100%;
  background: var(--ink);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font: 13px/1.5 var(--sans);
}
textarea.mono,
pre.mono {
  font: 12px/1.6 var(--mono);
}
textarea {
  resize: vertical;
}
label.field {
  display: block;
  margin: 0 0 10px;
  font-size: 12px;
  color: var(--muted);
}
label.field b {
  display: block;
  margin-bottom: 3px;
  color: var(--text);
  font-weight: 600;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px 16px;
}
@media (max-width: 720px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
  #app {
    display: block;
    height: auto;
  }
  .rail {
    width: 100%;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
}

pre.mono {
  background: var(--ink);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  padding: 10px 12px;
  overflow-x: auto;
  margin: 6px 0;
  white-space: pre-wrap;
  word-break: break-word;
}
.qrow {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  border-top: 1px solid var(--line-soft);
  padding: 10px 0;
}
.qrow:first-child {
  border-top: 0;
}
.qrow .qmeta {
  width: 190px;
  flex: none;
  font-size: 11.5px;
  color: var(--muted);
}
.qrow .qmeta .plat {
  color: var(--text);
  font-weight: 600;
  font-size: 12px;
}
.qrow pre.mono {
  flex: 1;
  margin: 0;
}
.qrow .btn {
  flex: none;
}
.num {
  font-variant-numeric: tabular-nums;
}

.thinking {
  color: var(--muted);
  font-size: 13px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.thinking::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  border-top-color: transparent;
  animation: spin 0.9s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .thinking::before {
    animation: none;
  }
}

.stream {
  font: 12px/1.6 var(--mono);
  color: var(--muted);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 180px;
  overflow-y: auto;
  margin-top: 8px;
}
.why {
  color: var(--muted);
  font-size: 12.5px;
}
.qq {
  font-weight: 600;
}
a {
  color: var(--accent);
}
.cand-list .qrow .qmeta {
  width: 230px;
}

/* ── W13 additions: states, envelope, tables, steps ──────────────────── */
.mod-item {
  flex-wrap: wrap;
}
.mod-item .mod-label {
  flex: 1;
}
.mod-item .mod-state {
  font: 600 9.5px/1 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}
.dot.ok {
  background: var(--ok);
}
.dot.warn {
  background: var(--warn);
}
.dot.bad {
  background: var(--bad);
}
.state-line {
  margin: 0 0 12px;
  font-size: 12.5px;
}
.chips {
  margin: 4px 0 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.req-card {
  margin: 14px 0;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}
.stack {
  margin: 10px 0;
  padding-top: 8px;
  border-top: 1px solid var(--line-soft);
}
.stack:first-of-type {
  border-top: 0;
  padding-top: 0;
}
.gap {
  height: 8px;
}
.grow {
  flex: 1;
  min-width: 0;
}
.panel h4.first {
  margin-top: 0;
}
.panel.decision {
  border-left: 3px solid var(--accent);
}
.lead {
  font-size: 15px;
  font-weight: 600;
}
.mod-head.tight {
  margin: 0 0 6px;
}
.mod-head.tight h3 {
  margin: 0;
}
details.panel > summary {
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
}
details.panel[open] > summary {
  margin-bottom: 8px;
}
.table-wrap {
  overflow-x: auto;
}
table.status {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
table.status th,
table.status td {
  text-align: left;
  vertical-align: top;
  padding: 6px 8px;
  border-top: 1px solid var(--line-soft);
}
table.status thead th {
  border-top: 0;
  color: var(--muted);
  font: 600 10px/1 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
ol.steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
button.step {
  width: 100%;
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 2px 10px;
  text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
button.step:hover {
  border-color: var(--muted);
}
button.step.recommended {
  border-color: var(--accent);
}
button.step .step-label {
  grid-row: 1 / span 2;
  font: 700 14px/1.2 var(--mono);
  color: var(--accent);
}
button.step .step-title {
  font-weight: 600;
}
.qrow.not-runnable pre.mono {
  opacity: 0.7;
  border-style: dashed;
}
.progress-line {
  font: 12px/1.6 var(--mono);
  color: var(--muted);
  margin-top: 8px;
}
.form-grid .field.span {
  grid-column: 1 / -1;
}
#research-panel input,
#research-panel select,
#research-panel textarea,
.panel > details > input,
.panel > details > select,
.panel > details > textarea {
  margin: 6px 0;
}
.rail-foot .ver {
  display: block;
  margin-top: 4px;
  font: 10px/1 var(--mono);
}
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>

</div>

  var normName = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z\s]/g, " ").replace(/\b(dr|mr|mrs|ms|phd|md|rn|jr|sr|ii|iii)\b/g, " ").replace(/\s+/g, " ").trim();
  var normOrg = (s) => (s ?? "").toLowerCase().replace(/\b(inc|llc|ltd|corp|corporation|company|co|plc|gmbh)\b/g, " ").replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
  var normUrl = (u) => u.toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/+$/, "").split("?")[0];
  function findIdentityMatches(incoming, existing) {
    const out = [];
    const name = normName(incoming.name);
    const org = normOrg(incoming.currentCompany);
    const urls = new Set(
      (incoming.profileUrls ?? []).map(normUrl).filter(Boolean)
    );
    for (const other of existing) {
      if (other.id === incoming.id) continue;
      const oUrls = (other.profileUrls ?? []).map(normUrl).filter(Boolean);
      const sharedUrl = oUrls.find((u) => urls.has(u));
      if (sharedUrl) {
        out.push({
          otherId: other.id,
          strength: "same_urls",
          reason: `Same profile URL (${sharedUrl}).`
        });
        continue;
      }
      const oName = normName(other.name);
      if (!name || !oName) continue;
      if (name === oName) {
        const oOrg = normOrg(other.currentCompany);
        if (org && oOrg && org === oOrg) {
          out.push({
            otherId: other.id,
            strength: "same_name_same_org",
            reason: `Same name and same organisation (${other.currentCompany}).`
          });
        } else if (org && oOrg && org !== oOrg) {
          out.push({
            otherId: other.id,
            strength: "same_name_different_org",
            reason: `Same name, conflicting organisations (${incoming.currentCompany} vs ${other.currentCompany}) — may be two people.`
          });
        } else {
          out.push({
            otherId: other.id,
            strength: "similar_name",
            reason: "Same name; organisation unknown on one side."
          });
        }
        continue;
      }
      const [a, b] = [name.split(" "), oName.split(" ")];
      if (a.length > 1 && b.length > 1 && a[a.length - 1] === b[b.length - 1] && a[0][0] === b[0][0]) {
        out.push({
          otherId: other.id,
          strength: "similar_name",
          reason: `Similar name (${other.name}).`
        });
      }
    }
    return out;
  }

      name: "Canonical IR: one requirement, one source phrase (no shared statements)",
      passed: Boolean(ir) && dupes === 0,
      detail: ir ? `${statements.length} statements, ${dupes} duplicated` : "IR not generated",
      kind: "model"
    });
    return out;
  }
  function scoreGolden(artifacts, cand, timings, executedModel) {
    const deterministic = runDefectChecks({
      document: typeof document !== "undefined" ? document : void 0
    });
    const executed = deterministic.map((c) => c.id);
    const notExecuted = [];
    const checks = [...deterministic];
    let benchmark;
    if (executedModel) {
      const model = modelChecks(artifacts, cand);
      checks.push(...model);
      executed.push(...model.map((c) => c.id));
      const intake = artifacts.intake?.payload;
      if (intake) {
        const text = intakeFullText(intake);
        const hits = GOLDEN_CONCEPTS.map((c) => ({
          concept: c.concept,
          hit: c.pattern.test(text)
        }));
        const hitCount = hits.filter((h) => h.hit).length;
        benchmark = {
          hits,
          hitCount,
          total: GOLDEN_CONCEPTS.length,
          threshold: GOLDEN_THRESHOLD
        };
        checks.push({
          id: "cais_concepts",
          name: `CAIS intake concept benchmark (≥${GOLDEN_THRESHOLD} of ${GOLDEN_CONCEPTS.length})`,
          passed: hitCount >= GOLDEN_THRESHOLD,
          detail: `${hitCount}/${GOLDEN_CONCEPTS.length}`,
          kind: "model"
        });
        executed.push("cais_concepts");
      } else {
        notExecuted.push({
          id: "cais_concepts",
          reason: "HM Intake was not generated."
        });
      }
    } else {
      notExecuted.push({
        id: "model_checks",
        reason: "Model-driven checks need a generation run (Run the full benchmark)."
      });
      notExecuted.push({
        id: "cais_concepts",
        reason: "Needs the generation run."
      });
    }
    const allPassed = checks.every((c) => c.passed);
    const verdict = allPassed ? notExecuted.length ? "PARTIAL" : "PASS" : "FAIL";
    return {
      ranAt: nowIso(),
      executed,
      notExecuted,
      checks,
      benchmark,
      timings,
      verdict
    };
  }
  async function runGoldenTest(ui, withModel) {
    if (!state.current || state.current.id !== EXAMPLE_SEARCH.id) {
      if (!state.searches.some((s) => s.id === EXAMPLE_SEARCH.id))
        state.searches = [EXAMPLE_SEARCH, ...state.searches];
      await selectSearch(EXAMPLE_SEARCH.id);
      renderRail();
    }
    state.module = "golden_test";
    const timings = [];
    let cand;
    if (withModel) {
      const plan = goldenPlan();
      const tracker = new ProgressTracker(plan);
      let currentCtl = null;
      ui.bindStop(() => currentCtl?.abort());
      const stepUi = {
        bindStop: (c) => {
          currentCtl = c;
        },
        onText: ui.onText
      };
      state.acknowledgedNoResearch.add(EXAMPLE_SEARCH.id);
      for (const key of GOLDEN_STEPS) {
        ui.step(MODULES[key].label);
        tracker.start(key, "generate");
        const t0 = Date.now();
        await generateModule(key, stepUi);
        tracker.done(key, "generate");
        timings.push({ step: key, ms: Date.now() - t0 });
        if (key === "intake") {
          ui.step(
            "Answering intake as the hiring manager (test input, labelled)"
          );
          const rec = state.artifacts.intake;
          let payload = rec?.payload;
          if (rec && payload) {
            let answered = 0;
            for (const cat of payload.categories) {
              if (answered >= GOLDEN_HM_ANSWERS.length) break;
              const q = cat.questions[0];
              if (!q?.id) continue;
              payload = withIntakeAnswer(
                payload,
                q.id,
                GOLDEN_HM_ANSWERS[answered],
                nowIso()
              );
              answered += 1;
            }
            await putArtifact("intake", { ...rec, payload });
          }
        }
      }
      ui.step(
        "Creating synthetic benchmark candidate (clearly labelled synthetic)"
      );
      cand = state.candidates.find((c) => c.name === GOLDEN_CANDIDATE.name) ?? {
        id: uid(),
        createdAt: nowIso(),
        ...GOLDEN_CANDIDATE
      };
      for (const key of ["evidence", "outreach"]) {
        ui.step(key === "evidence" ? "Evidence alignment" : "Outreach drafts");
        tracker.start(key, "generate");
        const t0 = Date.now();
        cand = { ...cand, [key]: await runCandidateTask(key, cand, stepUi) };
        tracker.done(key, "generate");
        timings.push({ step: key, ms: Date.now() - t0 });
      }
      await putCandidate(cand);
      tracker.finish();
    } else {
      cand = state.candidates.find((c) => c.name === GOLDEN_CANDIDATE.name);
    }
    ui.step("Scoring");
    const report = scoreGolden(
      state.artifacts,
      cand,
      timings,
      withModel || Boolean(state.artifacts.intake?.payload)
    );
    await putArtifact("golden_test", {
      payload: report,
      meta: { provider: "claude-artifact", generatedAt: report.ranAt },
      traitWarnings: []
    });
    return report;
  }
  function renderGolden(main) {
    const plan = goldenPlan();
    main.append(
      el(
        `<div class="mod-head"><h2>Golden Test</h2><span class="spacer"></span></div>`
      )
    );
    main.append(
      el(
        `<p class="mod-desc">Two kinds of checks. <b>${DEFECT_CHECKS.length} deliberate-defect checks</b> run instantly with no model: each injects a defect and asserts the system catches it. The <b>CAIS benchmark</b> generates every module for the bundled example search on your Claude account (${esc(plan.summary)}; expect 5–15 minutes) and scores concept presence plus honesty and fair-hiring guardrails. A PASS lists exactly which checks executed.</p>`
      )
    );
    const rec = state.artifacts.golden_test;
    const head = $(".mod-head", main);
    const quick = el(
      `<button class="btn" type="button">Run defect checks (no model)</button>`
    );
    head?.append(quick);
    const full = el(
      `<button class="btn ${rec ? "" : "primary"}" type="button">${rec ? "Run full benchmark again" : "Run full benchmark"}</button>`
    );
    const stopBtn = el(
      `<button class="btn small" type="button" hidden>Stop</button>`
    );
    if (aiAvailable()) head?.append(full, stopBtn);
    else
      main.append(
        el(
          `<div class="notice warning">${esc(copyFor("not_granted"))} The defect checks still run.</div>`
        )
      );
    const runIt = async (withModel, btn) => {
      btn.disabled = true;
      stopBtn.hidden = !withModel;
      const progress = el(
        `<div class="panel" role="status" aria-live="polite"><h3>Running…</h3><ul class="run-log"></ul><div class="stream"></div></div>`
      );
      main.insertBefore(progress, main.children[2] ?? null);
      const log = $(".run-log", progress);
      const streamEl = $(".stream", progress);
      let stopFn = null;
      stopBtn.onclick = () => stopFn?.();
      const t0 = Date.now();
      try {
        await runGoldenTest(
          {
            bindStop: (fn) => {
              stopFn = fn;
            },
            step: (name) => log?.append(
              el(
                `<li>${esc(name)} <span class="why num">${formatElapsed(Date.now() - t0)}</span></li>`
              )
            ),
            onText: ({ text }) => {
              if (streamEl) {
                streamEl.textContent = text.slice(-1200);
                streamEl.scrollTop = streamEl.scrollHeight;
              }
            }
          },
          withModel
        );
        render();
      } catch (e) {
        const code = errorCode(e);
        if (code === "not_granted" || code === "sampling_disabled") hideAi();
        progress.append(
          el(
            `<div class="notice error" role="alert"><strong>Run stopped.</strong> ${esc(copyFor(code))} <span class="why">${esc(errorMessage(e))}</span> Completed steps are saved.</div>`
          )
        );
        btn.disabled = false;
        stopBtn.hidden = true;
      }
    };
    quick.onclick = () => runIt(false, quick);
    full.onclick = () => runIt(true, full);
    if (rec?.payload) {
      const r = rec.payload;
      const cls = r.verdict === "PASS" ? "ok" : r.verdict === "PARTIAL" ? "warn" : "bad";
      main.append(
        el(
          `<div class="notice"><strong>Verdict: <span class="chip ${cls}">${esc(r.verdict)}</span></strong> — ${r.checks.filter((c) => c.passed).length} of ${r.checks.length} checks passed; ${r.executed.length} executed, ${r.notExecuted.length} not executed. Finished ${esc(asOf(r.ranAt))}.</div>`
        )
      );
      main.append(
        el(
          `<div class="panel"><h3>Checks executed <span class="why num">${r.executed.length}</span></h3><ul>${r.checks.map(
            (c) => `<li><span class="chip ${c.passed ? "ok" : "bad"}">${c.passed ? "PASS" : "FAIL"}</span> <span class="chip num">${esc(c.kind)}</span> ${esc(c.name)} <span class="why">${esc(c.detail)}</span></li>`
          ).join(
            ""
          )}</ul>${r.notExecuted.length ? `<h4>Not executed</h4><ul>${r.notExecuted.map((n) => `<li><span class="chip unknown">SKIPPED</span> ${esc(n.id)} <span class="why">${esc(n.reason)}</span></li>`).join("")}</ul>` : ""}</div>`
        )
      );
      if (r.benchmark) {
        main.append(
          el(
            `<div class="panel"><h3>CAIS intake concept scorecard <span class="why num">${r.benchmark.hitCount}/${r.benchmark.total} (threshold ${r.benchmark.threshold})</span></h3><ul>${r.benchmark.hits.map((h) => `<li><span class="chip ${h.hit ? "ok" : "bad"}">${h.hit ? "HIT" : "MISS"}</span> ${esc(h.concept)}</li>`).join("")}</ul></div>`
          )
        );
      }
      if (r.timings.length)
        main.append(
          el(
            `<div class="panel"><h3>Step timings</h3><ul class="num">${r.timings.map((t) => `<li>${esc(t.step)}: ${(t.ms / 1e3).toFixed(1)}s</li>`).join("")}</ul></div>`
          )
        );
    } else if (aiAvailable()) {
      main.append(
        el(
          `<div class="panel"><p class="why">Not run yet. The full benchmark generates ${GOLDEN_STEPS.map((k) => MODULES[k].label).join(" → ")} for the bundled CAIS search (auto-answering three intake questions with labelled test input), adds a clearly-synthetic candidate, runs Evidence and Outreach, then scores everything. Your Claude account does the generating; the first call asks permission.</p></div>`
        )
      );
    }
  }
  registerModule("golden_test", renderGolden);

  // artifact-src/main.ts
  var ARTIFACT_VERSION = true ? "0.1.0+e45473708b" : "dev";
  setRenderer(() => {
    renderRail();
    renderMain();
  });
  $("#new-search-btn")?.addEventListener("click", () => {
    state.current = null;
    state.module = "overview";
    render();
  });
  async function boot() {
    const versionEl = $("#artifact-version");
    if (versionEl) versionEl.textContent = ARTIFACT_VERSION;
    window.__talentos = { version: ARTIFACT_VERSION, state, render };
    await reloadSearches();
    if (!state.searches.length) {
      await store.saveSearch(EXAMPLE_SEARCH);
      state.searches = [EXAMPLE_SEARCH];
    }
    await selectSearch(state.searches[0].id);
    render();
    const runtime = window.claude;
    const [db, sample] = await Promise.all([
      runtime ? runtime.use("db").catch(() => null) : Promise.resolve(null),
      runtime ? runtime.use("sample").catch(() => null) : Promise.resolve(null)
    ]);
    setSample(sample);
    if (db) {
      attachDb(db);
      const existing = await store.listSearches();
      if (!existing.length) await store.saveSearch(EXAMPLE_SEARCH);
      await reloadSearches();
      await selectSearch(
        state.current && state.searches.some((s) => s.id === state.current?.id) ? state.current.id : state.searches[0].id
      );
    }
    if (!sample) hideAi();
    render();
    if (!aiAvailable())
      console.info(
        "TalentOS: AI generation unavailable in this view; everything else works."
      );
  }
  void boot();
})();
</script>
