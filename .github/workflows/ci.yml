name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  verify-talentos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talentos
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Exclude private runtime data from packaging
        run: pnpm check:private-build

      - name: Headless critical path (mock provider)
        run: pnpm smoke
        env:
          TALENTOS_MODEL_PROVIDER: mock
          TALENTOS_DATABASE_PATH: ./data/ci-smoke.db

      - name: Check preserved artifact build
        run: pnpm build:artifact:check

      - name: Prove document safety guards detect deliberate defects
        run: pnpm test:documents:defects

      - name: Install browser for acceptance tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Standalone acceptance tests
        run: pnpm e2e

      - name: Artifact acceptance tests
        run: pnpm e2e:artifact
